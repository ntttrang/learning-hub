<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--clay-cream); }
  .wrap { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; }
  .cell svg { width: 26px; height: 26px; stroke: var(--ink); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .lbl { font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); text-align: center; }
  .note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-bottom: 12px; }
  b { color: var(--ink); }
</style></head>
<body>
<div class="wrap">
  <div class="note">Lucide icons · <b>1.75px stroke, rounded caps</b> · matches the clay-line weight</div>
  <div class="grid">
    <div class="cell"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><div class="lbl">zap</div></div>
    <div class="cell"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><div class="lbl">star</div></div>

    <div class="cell"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div class="lbl">chat</div></div>

</div></body></html>
