<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--clay-cream); }
  .wrap { padding: 24px 28px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; min-width: 56px; }
  .spec { font-family: var(--font-display); color: var(--ink); line-height: 1; }
  .ramp { margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }
</style></head>
<body>
<div class="wrap">
  <div class="ramp">
    <div class="row"><span class="label">76 / Display</span><span class="spec" style="font-size:76px;font-weight:800;letter-spacing:-0.02em;font-variation-settings:'opsz' 96;">Set sail</span></div>
    <div class="row"><span class="label">48 / H1</span><span class="spec" style="font-size:48px;font-weight:700;letter-spacing:-0.02em;font-variation-settings:'opsz' 48;">Building with AI</span></div>
    <div class="row"><span class="label">30 / H3</span><span class="spec" style="font-size:30px;font-weight:600;font-variation-settings:'opsz' 30;">Captain Corgi Hub</span></div>
    <div class="row"><span class="label">20 / Lead</span><span class="spec" style="font-family:var(--font-body);font-size:20px;font-weight:400;color:var(--ink-2);line-height:1.4;">A friendly stop-motion guide to software, AI, and the tools we ship with.</span></div>
  </div>
</div></body></html>
