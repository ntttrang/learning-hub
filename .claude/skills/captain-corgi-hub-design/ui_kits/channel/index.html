<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Captain Corgi Hub — Channel</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: var(--font-body); color: var(--fg); }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
</style>
<script>
  (() => {
    try {
      const t = localStorage.getItem('cc-theme');
      if (t === 'light' || t === 'dark' || t === 'night') document.documentElement.setAttribute('data-theme', t);
    } catch (_) {}
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="cc-body">
<div id="root"></div>

<!-- Theme toggle — auto / light / dark / deep night (collapses to icon, expands on hover) -->
<style>
  .cc-theme-toggle { position: fixed; bottom: 18px; right: 18px; z-index: 9999; display: inline-flex; padding: 4px; border-radius: 999px; background: var(--bg-elevated); border: 1.5px solid var(--border); box-shadow: var(--shadow-2); font-family: var(--font-mono); backdrop-filter: blur(8px); }
  .cc-theme-toggle button { border: none; background: transparent; cursor: pointer; padding: 7px 12px; border-radius: 999px; color: var(--fg-3); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; max-width: 32px; transition: max-width 280ms cubic-bezier(0.22, 1, 0.36, 1), padding 280ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease, background 180ms, color 180ms; }
  .cc-theme-toggle button:hover { color: var(--fg); }
  .cc-theme-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .cc-theme-toggle button[data-auto-shadow="true"] { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--fg); }
  .cc-theme-toggle button:not([aria-pressed="true"]) { max-width: 0; padding-left: 0; padding-right: 0; opacity: 0; pointer-events: none; }
  .cc-theme-label { display: inline-block; max-width: 0; overflow: hidden; transition: max-width 280ms cubic-bezier(0.22, 1, 0.36, 1); }
  .cc-theme-toggle:hover button, .cc-theme-toggle:focus-within button { max-width: 140px; padding: 7px 12px; opacity: 1; pointer-events: auto; }
  .cc-theme-toggle:hover .cc-theme-label, .cc-theme-toggle:focus-within .cc-theme-label { max-width: 80px; }
  .cc-theme-toggle svg { width: 13px; height: 13px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style>
<div class="cc-theme-toggle" role="radiogroup" aria-label="Theme">
  <button data-theme-set="auto" aria-pressed="false" title="Auto — follow system"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg><span class="cc-theme-label">Auto</span></button>
  <button data-theme-set="light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><span class="cc-theme-label">Light</span></button>
  <button data-theme-set="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="cc-theme-label">Dark</span></button>
  <button data-theme-set="night" aria-pressed="false" title="Deep night — low blue light"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0 0 8 6 6 0 0 0 0-8z"/><path d="M12 14v7M9 18l3-1 3 1"/></svg><span class="cc-theme-label">Night</span></button>
</div>
<script>
(() => {
  const root = document.documentElement, KEY = 'cc-theme';
  const valid = ['auto','light','dark','night'];
  const mql = matchMedia('(prefers-color-scheme: dark)');
  function render(choice) {
    const sys = mql.matches ? 'dark' : 'light';
    document.querySelectorAll('.cc-theme-toggle button[data-theme-set]').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.themeSet === choice ? 'true' : 'false');
      b.removeAttribute('data-auto-shadow');
      if (choice === 'auto' && b.dataset.themeSet === sys) b.setAttribute('data-auto-shadow','true');
    });
  }
  function apply(t, persist = true) {
    if (!valid.includes(t)) t = 'auto';
    if (t === 'auto') {
      root.removeAttribute('data-theme');
      if (persist) { try { localStorage.removeItem(KEY); } catch(_){} }
    } else {
      root.setAttribute('data-theme', t);
      if (persist) { try { localStorage.setItem(KEY, t); } catch(_){} }
    }
    render(t);
  }
  let initial = 'auto';
  try { const s = localStorage.getItem(KEY); if (['light','dark','night'].includes(s)) initial = s; } catch(_){}
  apply(initial, false);
  document.addEventListener('click', (e) => { const b = e.target.closest('.cc-theme-toggle button[data-theme-set]'); if (b) apply(b.dataset.themeSet); });
  const onSys = () => { if (!root.hasAttribute('data-theme')) render('auto'); };
  if (mql.addEventListener) mql.addEventListener('change', onSys); else if (mql.addListener) mql.addListener(onSys);
})();
</script>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
