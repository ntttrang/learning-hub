<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--clay-cream); }
  .wrap { padding: 22px 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ball { width: 44px; height: 44px; border-radius: 999px; background: var(--corgi-orange); animation: bob 1.6s infinite; }
  .ball.clay { animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  .ball.out { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); background: var(--sky-cyan); }
  .ball.in { animation-timing-function: cubic-bezier(0.4, 0, 1, 1); background: var(--hub-green); }
  .ball.linear { animation-timing-function: linear; background: var(--ink-4); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(28px); } }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); text-align: center; line-height: 1.3; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink); font-weight: 600; }
  .durs { margin-left: auto; display: flex; flex-direction: column; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
  .durs b { color: var(--ink); }
</style></head>
<body>
<div class="wrap">
  <div class="demo"><div class="ball clay"></div><div class="name">--ease-clay</div><div class="lbl">.34, 1.56, .64, 1<br/>entrances</div></div>
  <div class="demo"><div class="ball out"></div><div class="name">--ease-out</div><div class="lbl">.22, 1, .36, 1<br/>exits</div></div>
  <div class="demo"><div class="ball in"></div><div class="name">--ease-in</div><div class="lbl">.4, 0, 1, 1<br/>dismissals</div></div>
  <div class="demo"><div class="ball linear"></div><div class="name">linear</div><div class="lbl">progress, loops</div></div>
  <div class="durs">
    <span><b>--dur-fast</b> &nbsp; 180 ms &nbsp; hover</span>
    <span><b>--dur-base</b> &nbsp; 240 ms &nbsp; state-change</span>
    <span><b>--dur-slow</b> &nbsp; 380 ms &nbsp; entrance</span>
  </div>
</div></body></html>
