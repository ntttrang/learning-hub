<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--clay-cream); }
  .wrap { padding: 24px 28px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  pre { font-family: var(--font-mono); background: #1F2A33; color: #F6F2EA; border-radius: var(--r-md); padding: 16px 20px; font-size: 14px; line-height: 1.65; font-feature-settings: "calt" 1, "liga" 1; margin: 0; }
  .kw { color: #FBC00A; }
  .str { color: #3BB283; }
  .fn { color: #51BBD7; }
  .com { color: #A0A9B0; font-style: italic; }
</style></head>
<body>
<div class="wrap">
  <div class="label">JetBrains Mono — code • ligatures on</div>
<pre><span class="com">// captain-corgi/hub — set sail</span>
<span class="kw">const</span> <span class="fn">embed</span> = (text) =&gt; openai.embed({ text });
<span class="kw">if</span> (vector.length !== 1536) <span class="kw">throw</span> <span class="kw">new</span> Error(<span class="str">"wrong dim"</span>);</pre>
</div></body></html>
