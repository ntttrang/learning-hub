<!--
  theme-toggle.html — drop-in segmented theme switcher.
  Usage: copy the <script> and <style> below into your <head>, and the
  <div class="cc-theme-toggle"> markup wherever you want the switcher to
  appear (typically fixed bottom-right).

  The script reads + writes `cc-theme` in localStorage and sets
  `data-theme` on <html>. Four user-facing modes:

    auto    →  no localStorage entry, no data-theme attribute.
               The CSS @media (prefers-color-scheme) fallback in
               colors_and_type.css picks Light or Dark based on the OS.
    light   →  data-theme="light", forced
    dark    →  data-theme="dark",  forced
    night   →  data-theme="night", forced (deep-night amber, low blue light)

  In auto mode the toggle listens for system theme changes and
  re-renders so the UI always reflects what the OS currently shows.
-->
<style>
  .cc-theme-toggle {
    position: fixed; bottom: 18px; right: 18px; z-index: 9999;
    display: inline-flex; padding: 4px; border-radius: 999px;
    background: var(--bg-elevated); border: 1.5px solid var(--border);
    box-shadow: var(--shadow-2); font-family: var(--font-mono);
    backdrop-filter: blur(8px);
  }
  .cc-theme-toggle button {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 12px; border-radius: 999px;
    color: var(--fg-3); font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden;
    max-width: 32px;
    transition:
      max-width 280ms cubic-bezier(0.22, 1, 0.36, 1),
      padding   280ms cubic-bezier(0.22, 1, 0.36, 1),
      opacity   200ms ease,
      background 180ms, color 180ms;
  }
  .cc-theme-toggle button:hover { color: var(--fg); }
  .cc-theme-toggle button[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-fg);
  }
  /* When auto is the user's pick, show a subtle accent ring on whichever
     concrete mode is currently active under the hood. */
  .cc-theme-toggle button[data-auto-shadow="true"] {
    box-shadow: inset 0 0 0 1.5px var(--accent);
    color: var(--fg);
  }

  /* Collapsed: only the chosen mode's button is visible (icon only).
     The other buttons are pinched to zero width. */
  .cc-theme-toggle button:not([aria-pressed="true"]) {
    max-width: 0; padding-left: 0; padding-right: 0;
    opacity: 0; pointer-events: none;
  }
  /* Labels are wrapped in a span so we can collapse the text independently
     of the icon — keeps the icon visible in the resting state. */
  .cc-theme-label {
    display: inline-block; max-width: 0; overflow: hidden;
    transition: max-width 280ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Expanded: hover or any focus within the pill. */
  .cc-theme-toggle:hover button,
  .cc-theme-toggle:focus-within button {
    max-width: 140px; padding: 7px 12px;
    opacity: 1; pointer-events: auto;
  }
  .cc-theme-toggle:hover .cc-theme-label,
  .cc-theme-toggle:focus-within .cc-theme-label {
    max-width: 80px;
  }

  .cc-theme-toggle svg { width: 13px; height: 13px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style>

<div class="cc-theme-toggle" role="radiogroup" aria-label="Theme">
  <button data-theme-set="auto" aria-pressed="false" title="Auto — follow system">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
    <span class="cc-theme-label">Auto</span>
  </button>
  <button data-theme-set="light" aria-pressed="false" title="Light — clay cream">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <span class="cc-theme-label">Light</span>
  </button>
  <button data-theme-set="dark" aria-pressed="false" title="Dark — warm clay night">
    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <span class="cc-theme-label">Dark</span>
  </button>
  <button data-theme-set="night" aria-pressed="false" title="Deep night — amber, low-blue-light">
    <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0 0 8 6 6 0 0 0 0-8z"/><path d="M12 14v7M9 18l3-1 3 1"/></svg>
    <span class="cc-theme-label">Night</span>
  </button>
</div>

<script>
(() => {
  const root = document.documentElement;
  const KEY = 'cc-theme';
  const valid = ['auto', 'light', 'dark', 'night'];
  const mql = matchMedia('(prefers-color-scheme: dark)');

  function buttons() {
    return document.querySelectorAll('.cc-theme-toggle button[data-theme-set]');
  }

  function render(userChoice) {
    const systemTheme = mql.matches ? 'dark' : 'light';
    buttons().forEach((btn) => {
      const t = btn.dataset.themeSet;
      btn.setAttribute('aria-pressed', t === userChoice ? 'true' : 'false');
      // In auto mode, mark whichever concrete theme the OS resolves to.
      btn.removeAttribute('data-auto-shadow');
      if (userChoice === 'auto' && t === systemTheme) {
        btn.setAttribute('data-auto-shadow', 'true');
      }
    });
  }

  function apply(theme, persist = true) {
    if (!valid.includes(theme)) theme = 'auto';
    if (theme === 'auto') {
      root.removeAttribute('data-theme');
      if (persist) { try { localStorage.removeItem(KEY); } catch (_) {} }
    } else {
      root.setAttribute('data-theme', theme);
      if (persist) { try { localStorage.setItem(KEY, theme); } catch (_) {} }
    }
    render(theme);
  }

  // Init from storage. No entry → auto.
  let initial = 'auto';
  try {
    const stored = localStorage.getItem(KEY);
    if (stored && ['light', 'dark', 'night'].includes(stored)) initial = stored;
  } catch (_) {}
  apply(initial, false);

  // Wire up clicks
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.cc-theme-toggle button[data-theme-set]');
    if (!btn) return;
    apply(btn.dataset.themeSet);
  });

  // In auto mode, react to OS theme flips so the toggle's auto-shadow
  // hint stays accurate. (The CSS @media block handles colour swapping.)
  const onSystemChange = () => {
    if (!root.hasAttribute('data-theme')) render('auto');
  };
  if (mql.addEventListener) mql.addEventListener('change', onSystemChange);
  else if (mql.addListener) mql.addListener(onSystemChange);

  // Expose for programmatic use
  window.ccSetTheme = apply;
})();
</script>
