<!doctype html>
<html><head><meta charset="utf-8"/>
<title>End card — Captain Corgi</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--ink); overflow: hidden; }
  .slide { width: 1280px; height: 720px; background: var(--deep-teal); padding: 80px 96px; box-sizing: border-box; position: relative; font-family: var(--font-body); color: var(--clay-cream); }
  .gleam { position: absolute; inset: 0; background: radial-gradient(circle at 50% 20%, rgba(81,187,215,0.22), transparent 55%); pointer-events: none; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; position: relative; z-index: 1; }
  .kicker { font-family: var(--font-mono); font-size: 16px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--star-yellow); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: 1.0; letter-spacing: -0.025em; margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 56px; align-items: stretch; position: relative; z-index: 1; }
  .card { background: rgba(246,242,234,0.06); border: 1.5px solid rgba(246,242,234,0.15); border-radius: var(--r-xl); padding: 28px; backdrop-filter: blur(8px); display: flex; gap: 18px; cursor: pointer; }
  .thumb { width: 192px; aspect-ratio: 16/9; border-radius: var(--r-md); background: linear-gradient(135deg, #DD5D5D, #E13429); flex-shrink: 0; position: relative; }
  .thumb.go { background: linear-gradient(135deg, #289269, #3BB283); }
  .thumb .dur { position: absolute; bottom: 8px; right: 8px; font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; background: rgba(31,42,51,0.85); color: white; font-weight: 600; }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--star-yellow); margin-bottom: 6px; font-weight: 700; }
  .ti { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; margin: 0; }
  .meta { font-family: var(--font-body); font-size: 13px; opacity: 0.7; margin-top: 6px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 48px; position: relative; z-index: 1; }
  .sub { display: inline-flex; align-items: center; gap: 10px; padding: 18px 30px; background: var(--corgi-orange); color: white; font-family: var(--font-body); font-weight: 700; font-size: 20px; border-radius: var(--r-lg); box-shadow: 0 12px 28px rgba(0,0,0,0.25); }
  .handle { font-family: var(--font-mono); font-size: 15px; opacity: 0.85; letter-spacing: 0.04em; }
  .wm { position: absolute; bottom: 36px; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: -0.01em; opacity: 0.6; }
</style></head>
<body>
<div class="slide">
  <div class="gleam"></div>
  <div class="top">
    <span class="kicker">⚓ Thanks for sailing</span>
    <h1>Watch one more, then we'll head home.</h1>
  </div>
  <div class="row">
    <div class="card">
      <div class="thumb"><span class="dur">18:11</span></div>
      <div>
        <div class="lbl">Up next</div>
        <h3 class="ti">Local LLMs in 2026 — what actually works.</h3>
        <div class="meta">67K views · 2 mo ago</div>
      </div>
    </div>
    <div class="card">
      <div class="thumb go"><span class="dur">21:05</span></div>
      <div>
        <div class="lbl">Crew pick</div>
        <h3 class="ti">Kubernetes for tiny side projects.</h3>
        <div class="meta">9K views · 3 wks ago</div>
      </div>
    </div>
  </div>
  <div class="cta">
    <span class="sub"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2 L14.6 9 L22 9.5 L16.2 14.5 L18 22 L12 18 L6 22 L7.8 14.5 L2 9.5 L9.4 9 Z"/></svg> Subscribe</span>
    <span class="handle">@captain-corgi · 128K crewmates</span>
  </div>
  <div class="wm">Captain Corgi · captain-corgi-hub</div>
</div></body></html>
