name: release-agent
description: Prepare release PRs for corgi-greeter with scoped tools and escalation.

instructions: |
  Start from the linked issue or pull request.
  Produce a structured plan before acting.
  Use only approved tools.
  Work only on agent/release/* branches.
  Do not delete cloud resources.
  Escalate with a needs-human issue when blocked.

tools:
  - github
  - filesystem
  - aws-readonly
  - slack-release-notes

permissions:
  contents: write
  pull_requests: write
  issues: write

branch_scope:
  allow:
    - agent/release/*
    - release/*
  deny:
    - main

disable-model-invocation: false
