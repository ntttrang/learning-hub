name: test-writer
description: Add or update tests for a scoped issue.

instructions: |
  Read the issue and current implementation.
  Produce a plan before editing.
  Focus on tests and testability.
  Avoid product behavior changes unless the issue explicitly asks for them.
  Emit plan.json and result.json artifacts.

tools:
  - github
  - filesystem
  - shell-readonly

permissions:
  contents: write
  pull_requests: write
