<script>
(function(){'use strict';
  var root=document.documentElement;
  root.classList.toggle('cc-mock-embed',window.self!==window.top);
  var KEY='cc-theme';
  var VALID={'light':1,'dark':1,'night':1};
  function applyCcTheme(){
    try {
      var t=localStorage.getItem(KEY);
      if(t&&VALID[t]) root.setAttribute('data-theme',t);
      else root.removeAttribute('data-theme');
    }catch(err){/* private mode */}
  }
  applyCcTheme();
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY) applyCcTheme();
  });
  /* Hub embed: parent cannot set iframe <html>; sync forced theme via postMessage (plus storage fallback). */
  window.addEventListener('message',function(ev){
    try{
      var d=ev.data;
      if(!d||d.type!=='cc-theme-hub')return;
      var forced=String(d.forced||'');
      if(forced==='light'||forced==='dark'||forced==='night') root.setAttribute('data-theme',forced);
      else root.removeAttribute('data-theme');
    }catch(err2){}
  });
})();
</script>

{d:3,dt:'D3 · Memory & State',q:'Capturing decisions as artifacts supports:',opts:['Resumption and audit','MCP registry replication','Branch creation','LLM training'],ans:0,exp:'Correct answer: A) Resumption and audit'},
{d:3,dt:'D3 · Memory & State',q:'Preventing conflicting context means:',opts:['Ensuring agents do not act on contradictory state','Disabling memory','Removing tools','Using one agent only'],ans:0,exp:'Correct answer: A) Ensuring agents do not act on contradictory state'},
{d:3,dt:'D3 · Memory & State',q:'Drift detection requires:',opts:['Comparing current trajectory to prior decisions and intent','Disabling logs','Random sampling','Eliminating'],ans:0,exp:'Correct answer: A) Comparing current trajectory to prior decisions and intent'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Operational constraints for an agent task may include:',opts:['Time limits, budget limits, or scope limits','Aesthetic preferences','The agent\'s color theme','The number of CI runners'],ans:0,exp:'Correct answer: A) Time limits, budget limits, or scope limits'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Identifying quantitative evaluation signals helps:',opts:['Eliminate human review entirely','Provide measurable, repeatable indicators of agent quality','Disable guardrails','Reduce memory'],ans:1,exp:'Correct answer: B) Provide measurable, repeatable indicators of agent quality'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Identifying qualitative evaluation signals helps:',opts:['Capture nuanced, human-judgment aspects of agent outputs','Replace quantitative metrics','Skip evaluation','Eliminate logs'],ans:0,exp:'Correct answer: A) Capture nuanced, human-judgment aspects of agent outputs'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Aligning evaluation criteria with development intent ensures:',opts:['Evaluations measure what the team actually wants from the agent','Evaluations are random','Evaluations are skipped','Evaluations are only manual'],ans:0,exp:'Correct answer: A) Evaluations measure what the team actually wants from the agent'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Generating evaluation signals with automated scanning tools enables:',opts:['Continuous quality measurement in CI','Disabling manual review entirely','Removing observability','Eliminating guardrails'],ans:0,exp:'Correct answer: A) Continuous quality measurement in CI'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'A reasoning error is identified when:',opts:['The agent\'s plan or thought process produced an incorrect conclusion','The agent\'s tools were unavailable','The environment differed from expected','Memory expired'],ans:0,exp:'Correct answer: A) The agent\'s plan or thought process produced an incorrect conclusion'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'A context or environment issue is identified when:',opts:['The agent\'s working environment or inputs differ from expectations','The LLM is too small','The agent has no tools','Branch protection is on'],ans:0,exp:'Correct answer: A) The agent\'s working environment or inputs differ from expectations'},
{d:5,dt:'D5 · Multi-Agent',q:'A pipeline pattern in multi-agent orchestration is BEST described as:',opts:['Sequential handoffs where each agent processes output from the previous','Random parallelism','Single-agent execution','Tool-only execution'],ans:0,exp:'Correct answer: A) Sequential handoffs where each agent processes output from the previous'},
{d:5,dt:'D5 · Multi-Agent',q:'Configuring agent isolation typically uses:',opts:['Independent working contexts and scoped state','Shared in-memory state with no boundaries','Common file locks across agents','Disabled logging'],ans:0,exp:'Correct answer: A) Independent working contexts and scoped state'},
{d:5,dt:'D5 · Multi-Agent',q:'When two agents propose contradictory plans, the orchestration layer should:',opts:['Pick one at random','Detect the conflict and apply a resolution strategy (priority, merge, escalation)','Ignore both','Promote both to production'],ans:1,exp:'Correct answer: B) Detect the conflict and apply a resolution strategy (priority, merge, escalation)'},
{d:5,dt:'D5 · Multi-Agent',q:'Multi-agent artifacts suitable for review and audit include:',opts:['Plans, decision records, traces, and handoff metadata','Only the orchestrator\'s final summary','Just LLM token counts','Only Slack notifications'],ans:0,exp:'Correct answer: A) Plans, decision records, traces, and handoff metadata'},
{d:5,dt:'D5 · Multi-Agent',q:'Document key handoffs to enable:',opts:['Auditability and debugging across agent boundaries','Faster execution','Smaller LLMs','Disabled guardrails'],ans:0,exp:'Correct answer: A) Auditability and debugging across agent boundaries'},
{d:5,dt:'D5 · Multi-Agent',q:'A degraded multi-agent workflow may exhibit:',opts:['Partial completions, repeated failures, or coordination drift','Faster outputs','Better evaluation','Smaller artifacts'],ans:0,exp:'Correct answer: A) Partial completions, repeated failures, or coordination drift'},
{d:5,dt:'D5 · Multi-Agent',q:'Rollback in multi-agent recovery means:',opts:['Reverting changes across affected agents to a known good state','Disabling all agents','Removing memory','Re-running with new tools'],ans:0,exp:'Correct answer: A) Reverting changes across affected agents to a known good state'},
{d:5,dt:'D5 · Multi-Agent',q:'Lifecycle management of agents includes:',opts:['Adding, updating, replacing, and retiring agents in a controlled manner','Only adding new agents','Only deleting agents','Locking the agent set forever'],ans:0,exp:'Correct answer: A) Adding, updating, replacing, and retiring agents in a controlled manner'},
{d:6,dt:'D6 · Guardrails',q:'Assigning autonomy levels supports:',opts:['Risk-based delivery speed and compliance balance','Maximum agent independence','Eliminating oversight','Disabling logs'],ans:0,exp:'Correct answer: A) Risk-based delivery speed and compliance balance'},
{d:6,dt:'D6 · Guardrails',q:'Identifying actions requiring human judgment helps:',opts:['Focus oversight where it adds value','Slow everything down equally','Replace LLMs','Disable MCP'],ans:0,exp:'Correct answer: A) Focus oversight where it adds value'},
{d:6,dt:'D6 · Guardrails',q:'Blocking actions that violate compliance ensures:',opts:['Policies are enforced before harm occurs','Policies are enforced only after incidents','Policies are ignored','Policies are optional'],ans:0,exp:'Correct answer: A) Policies are enforced before harm occurs'},
{d:6,dt:'D6 · Guardrails',q:'Least-privilege execution context means:',opts:['The agent runs with only the permissions strictly needed','The agent runs as the repo owner','The agent runs with admin tokens','The agent runs with no permissions'],ans:0,exp:'Correct answer: A) The agent runs with only the permissions strictly needed'},
{d:6,dt:'D6 · Guardrails',q:'Explicit authorization for irreversible actions means:',opts:['An authorized human (or controlled path) must approve','The agent self-approves','Another agent approves','The action proceeds silently'],ans:0,exp:'Correct answer: A) An authorized human (or controlled path) must approve'},
{d:6,dt:'D6 · Guardrails',q:'Preserving execution velocity is achieved by:',opts:['Avoiding approvals that don\'t materially reduce risk','Adding approvals for every step','Removing all human review','Disabling agents'],ans:0,exp:'Correct answer: A) Avoiding approvals that don\'t materially reduce risk'},
{d:6,dt:'D6 · Guardrails',q:'A core principle of agentic SDLC integration is:',opts:['Agents replace developers entirely','Agents are integrated with clear inputs, outputs, scope, and oversight','Agents act without artifacts','Agents bypass CI'],ans:1,exp:'Correct answer: B) Agents are integrated with clear inputs, outputs, scope, and oversight'},
{d:6,dt:'D6 · Guardrails',q:'An agent failed because it used the wrong API endpoint. This is:',opts:['A tool misuse failure','A reasoning error','A memory failure','A branch conflict'],ans:0,exp:'Correct answer: A) A tool misuse failure'},
{d:6,dt:'D6 · Guardrails',q:'Capturing decisions as durable artifacts allows:',opts:['Resumption and traceability','Faster LLM inference','Smaller MCP registries','Removing guardrails'],ans:0,exp:'Correct answer: A) Resumption and traceability'},
{d:6,dt:'D6 · Guardrails',q:'Detecting and resolving overlapping code changes requires:',opts:['Coordination mechanisms across agents','Disabling parallelism','Removing branches','Larger LLMs'],ans:0,exp:'Correct answer: A) Coordination mechanisms across agents'},
{d:6,dt:'D6 · Guardrails',q:'A guardrail that blocks irreversible production changes ensures:',opts:['Compliance with high-risk action policy','Faster delivery','Smaller artifacts','Fewer logs'],ans:0,exp:'Correct answer: A) Compliance with high-risk action policy'},
{d:6,dt:'D6 · Guardrails',q:'Combining quantitative and qualitative signals:',opts:['Provides a balanced, comprehensive evaluation','Replaces guardrails','Eliminates the need for memory','Disables observability'],ans:0,exp:'Correct answer: A) Provides a balanced, comprehensive evaluation'},
{d:6,dt:'D6 · Guardrails',q:'Configuring MCP allow lists demonstrates:',opts:['Least-privilege at the tool boundary','Maximum tool exposure','Bypassing guardrails','Disabling logs'],ans:0,exp:'Correct answer: A) Least-privilege at the tool boundary'},
{d:6,dt:'D6 · Guardrails',q:'Continuity of memory and state across environments requires:',opts:['Defined state representation and synchronization mechanisms','Random sharing','No sharing at all','Disabling memory'],ans:0,exp:'Correct answer: A) Defined state representation and synchronization mechanisms'},
{d:6,dt:'D6 · Guardrails',q:'Which best describes a healthy agentic SDLC?',opts:['Agents act with no oversight','Agents operate within boundaries, produce inspectable artifacts, and are accountable','Agents replace CI pipelines','Agents take all production actions automatically'],ans:1,exp:'Correct answer: B) Agents operate within boundaries, produce inspectable artifacts, and are accountable'},
];

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

let S={
  phase:'start',
  questions:shuffle(Q),
  answers:{},
  flags:{},
  cur:0,
  startMs:null,
  elapsed:0,
  tid:null
};

const app=document.getElementById('app');

function render(){
  if(S.phase==='start')renderStart();
  else if(S.phase==='exam')renderExam();
  else renderResults();
}

function renderStart(){
  app.innerHTML=`<div class="start-screen">
<div class="start-brand">Captain Corgi Hub</div>
<div class="start-logo" aria-hidden="true"><img src="assets/captain-corgi-hub-design/assets/captain-corgi-hub-avatar.png" alt=""></div>
<div class="start-title">GH-600 practice exam</div>
<div class="start-sub">Practice exam 5 — Fifty questions across all six domains, weighted to match the real exam mix. We drew this from the official Microsoft Learn study guide and GitHub Docs.</div>
<div class="meta-cards">
  <div class="mc"><div class="mc-v">50</div><div class="mc-l">Questions</div></div>
  <div class="mc"><div class="mc-v">90</div><div class="mc-l">Minutes</div></div>
  <div class="mc"><div class="mc-v">700</div><div class="mc-l">Pass mark /1000</div></div>
  <div class="mc"><div class="mc-v">6</div><div class="mc-l">Domains</div></div>
</div>
<div class="start-note">
  <strong>How this run works:</strong> No answer hints until you submit. Flag questions to revisit if you like. The grid tracks where you are. When the timer hits 90 minutes, we auto-submit.
</div>
<button class="btn btn-primary" type="button" id="start-btn" style="font-size:var(--fs-body);padding:11px 32px">Start exam</button>
</div>`;
  document.getElementById('start-btn').onclick=()=>{
    S.phase='exam';S.startMs=Date.now();startTimer();render();
  };
}

function startTimer(){
  S.tid=setInterval(()=>{
    S.elapsed=Math.floor((Date.now()-S.startMs)/1000);
    const rem=MINS*60-S.elapsed;
    if(rem<=0){clearInterval(S.tid);S.phase='results';render();return;}
    const el=document.getElementById('timer-display');
    if(el){
      const m=Math.floor(rem/60),sc=rem%60;
      el.textContent=m+':'+(sc<10?'0':'')+sc;
      const pill=document.getElementById('timer-pill');
      if(pill)pill.className='timer-pill'+(rem<300?' danger':rem<900?' warn':'');
    }
    const fill=document.getElementById('prog-fill');
    if(fill)fill.style.width=(S.cur/S.questions.length*100)+'%';
  },1000);
}

function renderExam(){
  const q=S.questions[S.cur];
  const total=S.questions.length;
  const answered=Object.keys(S.answers).length;
  const flagged=Object.values(S.flags).filter(Boolean).length;
  const rem=MINS*60-S.elapsed;
  const m=Math.floor(rem/60),sc=rem%60;

  app.innerHTML=`
<div class="exam-header">
  <div class="eh-title">GH-600 practice exam</div>
  <span class="eh-meta">${answered} answered · ${flagged} flagged</span>
  <div class="timer-pill" id="timer-pill"><span id="timer-display">${m}:${sc<10?'0':''}${sc}</span></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:${S.cur/total*100}%"></div></div>
<div class="exam-body">
  <div class="q-sidebar">
    <div class="qs-label">Question list</div>
    <div class="qs-stats">Answered: <span>${answered}/${total}</span></div>
    <div class="q-grid" id="q-grid"></div>
    <button class="btn btn-danger" type="button" id="sb-submit" style="width:100%;justify-content:center">Submit</button>
  </div>
  <div class="q-panel">
    <div class="q-meta">
      <span class="q-num-badge">Q${S.cur+1} / ${total}</span>
      <span class="q-domain-badge">${q.dt}</span>
      ${S.flags[S.cur]?'<span class="q-flag-badge">Flagged</span>':''}
    </div>
    <div class="q-text">${q.q}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt${S.answers[S.cur]===i?' sel':''}" data-i="${i}"><span class="opt-l">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="q-nav-bar">
      <div class="btn-row">
        <button class="btn" type="button" id="prev" ${S.cur===0?'disabled':''}>Previous</button>
        <button class="btn" type="button" id="flag-btn">${S.flags[S.cur]?'Unflag':'Flag'}</button>
        <button class="btn" type="button" id="next" ${S.cur===total-1?'disabled':''}>Next</button>
      </div>
      <button class="btn btn-danger" type="button" id="submit-btn">Submit exam</button>
    </div>
  </div>
</div>
<div id="modal-area"></div>`;

  const grid=document.getElementById('q-grid');
  S.questions.forEach((_,i)=>{
    const b=document.createElement('button');
    const isAns=S.answers[i]!==undefined,isFlag=S.flags[i],isCur=i===S.cur;
    b.className='q-dot '+(isFlag?'flag':isAns?'ans':'unans')+(isCur?' cur':'');
    b.textContent=i+1;b.title='Q'+(i+1);
    b.onclick=()=>{S.cur=i;render();};
    grid.appendChild(b);
  });

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{S.answers[S.cur]=parseInt(btn.dataset.i);render();};
  });
  document.getElementById('prev').onclick=()=>{if(S.cur>0){S.cur--;render();}};
  document.getElementById('next').onclick=()=>{if(S.cur<total-1){S.cur++;render();}};
  document.getElementById('flag-btn').onclick=()=>{S.flags[S.cur]=!S.flags[S.cur];render();};

  const showConfirm=()=>{
    const unanswered=total-Object.keys(S.answers).length;
    document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" id="modal-overlay">
<div class="modal">
  <h3>Submit your exam?</h3>
  <p>${unanswered>0?`You still have <strong>${unanswered}</strong> unanswered question${unanswered!==1?'s':''}.`:'Every question has an answer.'} We will score what you have now.</p>
  <div class="modal-btns">
    <button class="btn" type="button" id="cancel-btn">Cancel</button>
    <button class="btn btn-primary" type="button" id="confirm-btn">Submit</button>
  </div>
</div></div>`;
    document.getElementById('confirm-btn').onclick=()=>{clearInterval(S.tid);S.phase='results';render();};
    document.getElementById('cancel-btn').onclick=()=>{document.getElementById('modal-area').innerHTML='';};
    document.getElementById('modal-overlay').onclick=e=>{if(e.target.id==='modal-overlay')document.getElementById('modal-area').innerHTML='';};
  };
  document.getElementById('submit-btn').onclick=showConfirm;
  document.getElementById('sb-submit').onclick=showConfirm;
}

function renderResults(){
  clearInterval(S.tid);
  const total=S.questions.length;
  let correct=0;
  const ds={1:{n:'D1 · Architecture & SDLC',c:0,t:0},2:{n:'D2 · Tool Use & MCP',c:0,t:0},3:{n:'D3 · Memory & State',c:0,t:0},4:{n:'D4 · Evaluation & Tuning',c:0,t:0},5:{n:'D5 · Multi-Agent',c:0,t:0},6:{n:'D6 · Guardrails',c:0,t:0}};
  S.questions.forEach((q,i)=>{ds[q.d].t++;if(S.answers[i]===q.ans){correct++;ds[q.d].c++;}});
  const scaled=Math.round(correct/total*1000);
  const pass=scaled>=PASS;
  const pct=Math.round(correct/total*100);
  const elapsed=S.elapsed,em=Math.floor(elapsed/60),es=elapsed%60;

  let domCards='';
  [1,2,3,4,5,6].forEach(d=>{
    const {n,c,t}=ds[d];
    const p=Math.round(c/t*100);
    const cls=p>=75?'g':p>=60?'m':'b';
    domCards+=`<div class="db-card"><div class="db-name">${n}</div><div class="db-score">${c}/${t} <span style="font-size:var(--fs-small);color:var(--fg-3)">(${p}%)</span></div><div class="db-bar-bg"><div class="db-bar-fill ${cls}" style="width:${p}%"></div></div></div>`;
  });

  app.innerHTML=`<div class="results-page">
<div class="result-hero">
  <div class="result-score ${pass?'pass':'fail'}">${scaled}</div>
  <div class="result-verdict">${pass?'Nice work — that\'s a pass':'Not this time — keep going'}</div>
  <div class="result-sub">${correct}/${total} correct (${pct}%) · Pass mark: 700/1000</div>
  <div class="result-meta">
    <span class="rm-chip">Time used: ${em}m ${es}s</span>
    <span class="rm-chip">${pass?'Above pass mark':'Below pass mark'}</span>
    <span class="rm-chip">${Object.values(S.flags).filter(Boolean).length} flagged questions</span>
  </div>
</div>
<div class="domain-breakdown-title">Score by domain</div>
<div class="domain-breakdown">${domCards}</div>
<div class="divider"></div>
<div class="btn-row" style="margin-bottom:var(--space-5)">
  <button class="btn btn-primary" type="button" id="review-btn">Review all answers</button>
  <button class="btn" type="button" id="retake-btn">Retake exam</button>
</div>
<div id="review-out"></div>
</div>`;

  document.getElementById('retake-btn').onclick=()=>{
    clearInterval(S.tid);
    S={phase:'start',questions:shuffle(Q),answers:{},flags:{},cur:0,startMs:null,elapsed:0,tid:null};
    render();
  };

  let open=false;
  document.getElementById('review-btn').onclick=()=>{
    const out=document.getElementById('review-out');
    if(open){out.innerHTML='';open=false;document.getElementById('review-btn').textContent='Review all answers';return;}
    open=true;document.getElementById('review-btn').textContent='Hide review';
    let html=`<div class="domain-breakdown-title" style="margin-bottom:var(--space-3)">Every question — ${total} total</div>`;
    S.questions.forEach((q,i)=>{
      const chosen=S.answers[i],isOk=chosen===q.ans,skip=chosen===undefined;
      const status=skip?'<span style="color:var(--warning)">Skipped</span>':isOk?'<span style="color:var(--success)">Correct</span>':'<span style="color:var(--danger)">Wrong</span>';
      html+=`<div class="rq ${skip?'skip':isOk?'ok':'bad'}">
<div class="rq-meta"><strong>Q${i+1}</strong><span>${q.dt}</span>${status}</div>
<div class="rq-q">${q.q}</div>`;
      q.opts.forEach((o,oi)=>{
        let cls='nn';
        if(oi===q.ans&&chosen===oi)cls='cc';
        else if(oi===chosen&&chosen!==q.ans)cls='cw';
        else if(oi===q.ans)cls='rc';
        html+=`<div class="ro ${cls}"><span style="font-weight:700;flex-shrink:0;font-family:var(--font-mono)">${LETTERS[oi]}.</span><span>${o}</span></div>`;
      });
      html+=`<div class="rq-exp"><strong>Explanation:</strong> ${q.exp}</div></div>`;
    });
    out.innerHTML=html;out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}

render();
</script>
</body>
</html>
