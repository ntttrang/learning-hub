<script>
(function(){'use strict';
  var root=document.documentElement;
  root.classList.toggle('cc-mock-embed',window.self!==window.top);
  var KEY='cc-theme';
  var VALID={'light':1,'dark':1,'night':1};
  function applyCcTheme(){
    try {
      var t=localStorage.getItem(KEY);
      if(t&&VALID[t]) root.setAttribute('data-theme',t);
      else root.removeAttribute('data-theme');
    }catch(err){/* private mode */}
  }
  applyCcTheme();
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY) applyCcTheme();
  });
  /* Hub embed: parent cannot set iframe <html>; sync forced theme via postMessage (plus storage fallback). */
  window.addEventListener('message',function(ev){
    try{
      var d=ev.data;
      if(!d||d.type!=='cc-theme-hub')return;
      var forced=String(d.forced||'');
      if(forced==='light'||forced==='dark'||forced==='night') root.setAttribute('data-theme',forced);
      else root.removeAttribute('data-theme');
    }catch(err2){}
  });
})();
</script>

{d:1,dt:'D1 · Architecture & SDLC',q:'Before deploying an agent, you should:',opts:['Define its inputs, outputs, success criteria, and SDLC integration points','Pick the largest LLM available','Disable observability','Grant maximum permissions'],ans:0,exp:'Correct answer: A) Define its inputs, outputs, success criteria, and SDLC integration points'},
{d:1,dt:'D1 · Architecture & SDLC',q:'An anti-pattern in agent design is:',opts:['Allowing the agent to escalate its own permissions','Producing structured plans','Validating outputs before action','Logging decisions'],ans:0,exp:'Correct answer: A) Allowing the agent to escalate its own permissions'},
{d:1,dt:'D1 · Architecture & SDLC',q:'Why output a structured plan?',opts:['To allow human and automated validation','To increase memory consumption','To enable random execution','To skip evaluation'],ans:0,exp:'Correct answer: A) To allow human and automated validation'},

{d:1,dt:'D1 · Architecture & SDLC',q:'Right-sized human intervention means:',opts:['Approvals only where they reduce material risk','Approval on every action','No approvals at all','Random approvals'],ans:0,exp:'Correct answer: A) Approvals only where they reduce material risk'},

{d:3,dt:'D3 · Memory & State',q:'Memory scoped to task-relevant information avoids:',opts:['Distraction and noise from irrelevant context','The need for tools','Logging','Branch protection'],ans:0,exp:'Correct answer: A) Distraction and noise from irrelevant context'},
{d:3,dt:'D3 · Memory & State',q:'Defining reset rules for memory prevents:',opts:['Stale data persisting across unrelated tasks','Tool growth','MCP failures','Branch conflicts'],ans:0,exp:'Correct answer: A) Stale data persisting across unrelated tasks'},
{d:3,dt:'D3 · Memory & State',q:'Resuming work without repeating steps requires:',opts:['Durable artifacts capturing prior progress','Disabling memory','Removing tools','Increased autonomy'],ans:0,exp:'Correct answer: A) Durable artifacts capturing prior progress'},
{d:3,dt:'D3 · Memory & State',q:'Sharing agent state across tools requires:',opts:['A defined, consistent representation of state','Random formats','Disabled memory','Increased context size only'],ans:0,exp:'Correct answer: A) A defined, consistent representation of state'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Success criteria for an agent task should be:',opts:['Specific, measurable, and aligned with development intent','Vague and subjective','Defined after the task ends','Optional'],ans:0,exp:'Correct answer: A) Specific, measurable, and aligned with development intent'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'A quantitative evaluation signal could be:',opts:['Percentage of agent PRs that pass CI without manual edits','Developer happiness rating','"Looks good to me"','Aesthetic appeal'],ans:0,exp:'Correct answer: A) Percentage of agent PRs that pass CI without manual edits'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'A qualitative evaluation signal could be:',opts:['Reviewer ratings on clarity, helpfulness, or correctness','Total tool calls','Token counts','Memory size'],ans:0,exp:'Correct answer: A) Reviewer ratings on clarity, helpfulness, or correctness'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Automated scanning helps:',opts:['Produce consistent evaluation signals at scale','Replace human judgment in all cases','Eliminate guardrails','Reduce traceability'],ans:0,exp:'Correct answer: A) Produce consistent evaluation signals at scale'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Classifying root causes helps:',opts:['Direct tuning to the right intervention','Increase agent autonomy','Disable evaluation','Remove memory'],ans:0,exp:'Correct answer: A) Direct tuning to the right intervention'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Revising agent instructions is a tuning lever for:',opts:['Reasoning errors and unclear behavior','Network failures','MCP outages','Branch protection rules'],ans:0,exp:'Correct answer: A) Reasoning errors and unclear behavior'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Refining tool access is a tuning lever for:',opts:['Tool misuse or over-/under-equipped agents','Memory growth','Branch protection','MCP registry size'],ans:0,exp:'Correct answer: A) Tool misuse or over-/under-equipped agents'},
{d:5,dt:'D5 · Multi-Agent',q:'Orchestration patterns help:',opts:['Coordinate work across multiple agents reliably','Increase autonomy without limits','Disable observability','Eliminate evaluation'],ans:0,exp:'Correct answer: A) Coordinate work across multiple agents reliably'},
{d:5,dt:'D5 · Multi-Agent',q:'Parallel execution requires:',opts:['Agent isolation to avoid interference','Shared global state with no boundaries','A single LLM call','No artifacts'],ans:0,exp:'Correct answer: A) Agent isolation to avoid interference'},
{d:5,dt:'D5 · Multi-Agent',q:'Conflicts between agents can include:',opts:['Overlapping code changes, contradictory decisions, or duplicated effort','Token budgets','MCP registry sizes','Branch counts'],ans:0,exp:'Correct answer: A) Overlapping code changes, contradictory decisions, or duplicated effort'},
{d:5,dt:'D5 · Multi-Agent',q:'Multi-agent observability artifacts include:',opts:['Logs, decision records, handoffs, and operational signals','Only final outputs','Only LLM model names','None — agents are autonomous'],ans:0,exp:'Correct answer: A) Logs, decision records, handoffs, and operational signals'},
{d:5,dt:'D5 · Multi-Agent',q:'Post-hoc analysis of agents requires:',opts:['Retained artifacts and logs to review behavior after execution','Real-time only data','No artifacts','Removed observability'],ans:0,exp:'Correct answer: A) Retained artifacts and logs to review behavior after execution'},
{d:5,dt:'D5 · Multi-Agent',q:'Recovery patterns include:',opts:['Rollback, retry, and human-in-the-loop intervention','Silent failure','Ignoring stalled agents','Disabling logs'],ans:0,exp:'Correct answer: A) Rollback, retry, and human-in-the-loop intervention'},
{d:5,dt:'D5 · Multi-Agent',q:'Replacing an agent without disruption requires:',opts:['Backwards-compatible interfaces and gradual rollout','Stopping all workflows','Removing observability','Disabling MCP'],ans:0,exp:'Correct answer: A) Backwards-compatible interfaces and gradual rollout'},
{d:5,dt:'D5 · Multi-Agent',q:'Retiring an agent must preserve:',opts:['Auditability and continuity of dependent workflows','Only the agent\'s prompt','Only the LLM weights','Nothing — fully delete'],ans:0,exp:'Correct answer: A) Auditability and continuity of dependent workflows'},
{d:6,dt:'D6 · Guardrails',q:'Risk classification of agent actions enables:',opts:['Right-sized autonomy decisions','Bypassing all guardrails','Random approvals','Disabled logging'],ans:0,exp:'Correct answer: A) Right-sized autonomy decisions'},
{d:6,dt:'D6 · Guardrails',q:'Actions that should require human approval:',opts:['Irreversible or compliance-sensitive changes','Reading documentation','Listing files','Posting comments'],ans:0,exp:'Correct answer: A) Irreversible or compliance-sensitive changes'},
{d:6,dt:'D6 · Guardrails',q:'Least-privilege permissions reduce:',opts:['Blast radius of misbehavior or compromise','Agent capability completely','Memory size','MCP throughput'],ans:0,exp:'Correct answer: A) Blast radius of misbehavior or compromise'},
{d:6,dt:'D6 · Guardrails',q:'Controlled paths for high-risk actions provide:',opts:['Defined, auditable authorization workflows','Random approvals','No oversight','Self-approval'],ans:0,exp:'Correct answer: A) Defined, auditable authorization workflows'},
{d:6,dt:'D6 · Guardrails',q:'Preserving velocity while enforcing guardrails means:',opts:['Automating low-risk paths and gating high-risk paths','Approving everything','Approving nothing','Removing all guardrails'],ans:0,exp:'Correct answer: A) Automating low-risk paths and gating high-risk paths'},
{d:6,dt:'D6 · Guardrails',q:'Blocking policy violations should happen:',opts:['Before the action executes','After the action completes','During audit only','Only on appeal'],ans:0,exp:'Correct answer: A) Before the action executes'},
{d:6,dt:'D6 · Guardrails',q:'A multi-agent workflow audit needs:',opts:['Per-agent attributable artifacts and decision records','Only the final report','Only LLM versions','Nothing — agents are trusted'],ans:0,exp:'Correct answer: A) Per-agent attributable artifacts and decision records'},
{d:6,dt:'D6 · Guardrails',q:'A failed agent run that re-does completed work indicates:',opts:['Missing durable state checkpoints','Too many tools','MCP misconfiguration','Excess memory'],ans:0,exp:'Correct answer: A) Missing durable state checkpoints'},
{d:6,dt:'D6 · Guardrails',q:'Drift correction relies on:',opts:['Comparing current state to intent and prior decisions','Random restarts','Disabling memory','Removing tools'],ans:0,exp:'Correct answer: A) Comparing current state to intent and prior decisions'},
{d:6,dt:'D6 · Guardrails',q:'Detecting overlapping code changes requires:',opts:['Cross-agent change tracking and resolution policy','Disabling parallel execution','Removing branch protection','Larger LLMs'],ans:0,exp:'Correct answer: A) Cross-agent change tracking and resolution policy'},
{d:6,dt:'D6 · Guardrails',q:'Blocking irreversible compliance-sensitive actions:',opts:['Is essential for accountability','Slows everything unnecessarily','Is optional','Is handled by the LLM'],ans:0,exp:'Correct answer: A) Is essential for accountability'},
{d:6,dt:'D6 · Guardrails',q:'Evaluation completeness improves when:',opts:['Quantitative and qualitative signals are combined and aligned with intent','Only one metric is used','Only humans evaluate','No evaluation occurs'],ans:0,exp:'Correct answer: A) Quantitative and qualitative signals are combined and aligned with intent'},
{d:6,dt:'D6 · Guardrails',q:'Tool-level least-privilege is enforced through:',opts:['MCP allow lists and scoped permissions','Adding more tools','Eliminating MCP','Disabling logs'],ans:0,exp:'Correct answer: A) MCP allow lists and scoped permissions'},
{d:6,dt:'D6 · Guardrails',q:'Continuity of memory across environments requires:',opts:['Defined state representation, synchronization, and conflict policy','Random sharing','No sharing','Memory removal'],ans:0,exp:'Correct answer: A) Defined state representation, synchronization, and conflict policy'},
{d:6,dt:'D6 · Guardrails',q:'The ideal agentic SDLC posture is:',opts:['Agents with clear scope, observability, accountability, and risk-aware oversight','Maximum autonomy with no oversight','Zero autonomy','Agents that bypass humans entirely'],ans:0,exp:'Correct answer: A) Agents with clear scope, observability, accountability, and risk-aware oversight'},
];

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

let S={
  phase:'start',
  questions:shuffle(Q),
  answers:{},
  flags:{},
  cur:0,
  startMs:null,
  elapsed:0,
  tid:null
};

const app=document.getElementById('app');

function render(){
  if(S.phase==='start')renderStart();
  else if(S.phase==='exam')renderExam();
  else renderResults();
}

function renderStart(){
  app.innerHTML=`<div class="start-screen">
<div class="start-brand">Captain Corgi Hub</div>
<div class="start-logo" aria-hidden="true"><img src="assets/captain-corgi-hub-design/assets/captain-corgi-hub-avatar.png" alt=""></div>
<div class="start-title">GH-600 practice exam</div>
<div class="start-sub">Practice exam 6 — Fifty questions across all six domains, weighted to match the real exam mix. We drew this from the official Microsoft Learn study guide and GitHub Docs.</div>
<div class="meta-cards">
  <div class="mc"><div class="mc-v">50</div><div class="mc-l">Questions</div></div>
  <div class="mc"><div class="mc-v">90</div><div class="mc-l">Minutes</div></div>
  <div class="mc"><div class="mc-v">700</div><div class="mc-l">Pass mark /1000</div></div>
  <div class="mc"><div class="mc-v">6</div><div class="mc-l">Domains</div></div>
</div>
<div class="start-note">
  <strong>How this run works:</strong> No answer hints until you submit. Flag questions to revisit if you like. The grid tracks where you are. When the timer hits 90 minutes, we auto-submit.
</div>
<button class="btn btn-primary" type="button" id="start-btn" style="font-size:var(--fs-body);padding:11px 32px">Start exam</button>
</div>`;
  document.getElementById('start-btn').onclick=()=>{
    S.phase='exam';S.startMs=Date.now();startTimer();render();
  };
}

function startTimer(){
  S.tid=setInterval(()=>{
    S.elapsed=Math.floor((Date.now()-S.startMs)/1000);
    const rem=MINS*60-S.elapsed;
    if(rem<=0){clearInterval(S.tid);S.phase='results';render();return;}
    const el=document.getElementById('timer-display');
    if(el){
      const m=Math.floor(rem/60),sc=rem%60;
      el.textContent=m+':'+(sc<10?'0':'')+sc;
      const pill=document.getElementById('timer-pill');
      if(pill)pill.className='timer-pill'+(rem<300?' danger':rem<900?' warn':'');
    }
    const fill=document.getElementById('prog-fill');
    if(fill)fill.style.width=(S.cur/S.questions.length*100)+'%';
  },1000);
}

function renderExam(){
  const q=S.questions[S.cur];
  const total=S.questions.length;
  const answered=Object.keys(S.answers).length;
  const flagged=Object.values(S.flags).filter(Boolean).length;
  const rem=MINS*60-S.elapsed;
  const m=Math.floor(rem/60),sc=rem%60;

  app.innerHTML=`
<div class="exam-header">
  <div class="eh-title">GH-600 practice exam</div>
  <span class="eh-meta">${answered} answered · ${flagged} flagged</span>
  <div class="timer-pill" id="timer-pill"><span id="timer-display">${m}:${sc<10?'0':''}${sc}</span></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:${S.cur/total*100}%"></div></div>
<div class="exam-body">
  <div class="q-sidebar">
    <div class="qs-label">Question list</div>
    <div class="qs-stats">Answered: <span>${answered}/${total}</span></div>
    <div class="q-grid" id="q-grid"></div>
    <button class="btn btn-danger" type="button" id="sb-submit" style="width:100%;justify-content:center">Submit</button>
  </div>
  <div class="q-panel">
    <div class="q-meta">
      <span class="q-num-badge">Q${S.cur+1} / ${total}</span>
      <span class="q-domain-badge">${q.dt}</span>
      ${S.flags[S.cur]?'<span class="q-flag-badge">Flagged</span>':''}
    </div>
    <div class="q-text">${q.q}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt${S.answers[S.cur]===i?' sel':''}" data-i="${i}"><span class="opt-l">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="q-nav-bar">
      <div class="btn-row">
        <button class="btn" type="button" id="prev" ${S.cur===0?'disabled':''}>Previous</button>
        <button class="btn" type="button" id="flag-btn">${S.flags[S.cur]?'Unflag':'Flag'}</button>
        <button class="btn" type="button" id="next" ${S.cur===total-1?'disabled':''}>Next</button>
      </div>
      <button class="btn btn-danger" type="button" id="submit-btn">Submit exam</button>
    </div>
  </div>
</div>
<div id="modal-area"></div>`;

  const grid=document.getElementById('q-grid');
  S.questions.forEach((_,i)=>{
    const b=document.createElement('button');
    const isAns=S.answers[i]!==undefined,isFlag=S.flags[i],isCur=i===S.cur;
    b.className='q-dot '+(isFlag?'flag':isAns?'ans':'unans')+(isCur?' cur':'');
    b.textContent=i+1;b.title='Q'+(i+1);
    b.onclick=()=>{S.cur=i;render();};
    grid.appendChild(b);
  });

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{S.answers[S.cur]=parseInt(btn.dataset.i);render();};
  });
  document.getElementById('prev').onclick=()=>{if(S.cur>0){S.cur--;render();}};
  document.getElementById('next').onclick=()=>{if(S.cur<total-1){S.cur++;render();}};
  document.getElementById('flag-btn').onclick=()=>{S.flags[S.cur]=!S.flags[S.cur];render();};

  const showConfirm=()=>{
    const unanswered=total-Object.keys(S.answers).length;
    document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" id="modal-overlay">
<div class="modal">
  <h3>Submit your exam?</h3>
  <p>${unanswered>0?`You still have <strong>${unanswered}</strong> unanswered question${unanswered!==1?'s':''}.`:'Every question has an answer.'} We will score what you have now.</p>
  <div class="modal-btns">
    <button class="btn" type="button" id="cancel-btn">Cancel</button>
    <button class="btn btn-primary" type="button" id="confirm-btn">Submit</button>
  </div>
</div></div>`;
    document.getElementById('confirm-btn').onclick=()=>{clearInterval(S.tid);S.phase='results';render();};
    document.getElementById('cancel-btn').onclick=()=>{document.getElementById('modal-area').innerHTML='';};
    document.getElementById('modal-overlay').onclick=e=>{if(e.target.id==='modal-overlay')document.getElementById('modal-area').innerHTML='';};
  };
  document.getElementById('submit-btn').onclick=showConfirm;
  document.getElementById('sb-submit').onclick=showConfirm;
}

function renderResults(){
  clearInterval(S.tid);
  const total=S.questions.length;
  let correct=0;
  const ds={1:{n:'D1 · Architecture & SDLC',c:0,t:0},2:{n:'D2 · Tool Use & MCP',c:0,t:0},3:{n:'D3 · Memory & State',c:0,t:0},4:{n:'D4 · Evaluation & Tuning',c:0,t:0},5:{n:'D5 · Multi-Agent',c:0,t:0},6:{n:'D6 · Guardrails',c:0,t:0}};
  S.questions.forEach((q,i)=>{ds[q.d].t++;if(S.answers[i]===q.ans){correct++;ds[q.d].c++;}});
  const scaled=Math.round(correct/total*1000);
  const pass=scaled>=PASS;
  const pct=Math.round(correct/total*100);
  const elapsed=S.elapsed,em=Math.floor(elapsed/60),es=elapsed%60;

  let domCards='';
  [1,2,3,4,5,6].forEach(d=>{
    const {n,c,t}=ds[d];
    const p=Math.round(c/t*100);
    const cls=p>=75?'g':p>=60?'m':'b';
    domCards+=`<div class="db-card"><div class="db-name">${n}</div><div class="db-score">${c}/${t} <span style="font-size:var(--fs-small);color:var(--fg-3)">(${p}%)</span></div><div class="db-bar-bg"><div class="db-bar-fill ${cls}" style="width:${p}%"></div></div></div>`;
  });

  app.innerHTML=`<div class="results-page">
<div class="result-hero">
  <div class="result-score ${pass?'pass':'fail'}">${scaled}</div>
  <div class="result-verdict">${pass?'Nice work — that\'s a pass':'Not this time — keep going'}</div>
  <div class="result-sub">${correct}/${total} correct (${pct}%) · Pass mark: 700/1000</div>
  <div class="result-meta">
    <span class="rm-chip">Time used: ${em}m ${es}s</span>
    <span class="rm-chip">${pass?'Above pass mark':'Below pass mark'}</span>
    <span class="rm-chip">${Object.values(S.flags).filter(Boolean).length} flagged questions</span>
  </div>
</div>
<div class="domain-breakdown-title">Score by domain</div>
<div class="domain-breakdown">${domCards}</div>
<div class="divider"></div>
<div class="btn-row" style="margin-bottom:var(--space-5)">
  <button class="btn btn-primary" type="button" id="review-btn">Review all answers</button>
  <button class="btn" type="button" id="retake-btn">Retake exam</button>
</div>
<div id="review-out"></div>
</div>`;

  document.getElementById('retake-btn').onclick=()=>{
    clearInterval(S.tid);
    S={phase:'start',questions:shuffle(Q),answers:{},flags:{},cur:0,startMs:null,elapsed:0,tid:null};
    render();
  };

  let open=false;
  document.getElementById('review-btn').onclick=()=>{
    const out=document.getElementById('review-out');
    if(open){out.innerHTML='';open=false;document.getElementById('review-btn').textContent='Review all answers';return;}
    open=true;document.getElementById('review-btn').textContent='Hide review';
    let html=`<div class="domain-breakdown-title" style="margin-bottom:var(--space-3)">Every question — ${total} total</div>`;
    S.questions.forEach((q,i)=>{
      const chosen=S.answers[i],isOk=chosen===q.ans,skip=chosen===undefined;
      const status=skip?'<span style="color:var(--warning)">Skipped</span>':isOk?'<span style="color:var(--success)">Correct</span>':'<span style="color:var(--danger)">Wrong</span>';
      html+=`<div class="rq ${skip?'skip':isOk?'ok':'bad'}">
<div class="rq-meta"><strong>Q${i+1}</strong><span>${q.dt}</span>${status}</div>
<div class="rq-q">${q.q}</div>`;
      q.opts.forEach((o,oi)=>{
        let cls='nn';
        if(oi===q.ans&&chosen===oi)cls='cc';
        else if(oi===chosen&&chosen!==q.ans)cls='cw';
        else if(oi===q.ans)cls='rc';
        html+=`<div class="ro ${cls}"><span style="font-weight:700;flex-shrink:0;font-family:var(--font-mono)">${LETTERS[oi]}.</span><span>${o}</span></div>`;
      });
      html+=`<div class="rq-exp"><strong>Explanation:</strong> ${q.exp}</div></div>`;
    });
    out.innerHTML=html;out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}

render();
</script>
</body>
</html>
