<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--clay-cream); }
  .wrap { padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .card { background: white; border: var(--bw) solid var(--border-soft); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 8px; }
  .thumb { aspect-ratio: 16/9; border-radius: var(--r-md); background: linear-gradient(135deg, var(--deep-teal), var(--sky-cyan-deep)); position: relative; overflow: hidden; }
  .thumb.hub { background: linear-gradient(135deg, var(--hub-coral), var(--captain-red)); }
  .thumb.green { background: linear-gradient(135deg, var(--hub-green-deep), var(--hub-green)); }
  .dur { position: absolute; bottom: 6px; right: 6px; background: rgba(31,42,51,0.85); color: white; font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .title { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.25; letter-spacing: -0.01em; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
  .dot { width: 3px; height: 3px; background: currentColor; border-radius: 999px; }
  svg.star { width: 28px; height: 28px; position: absolute; top: 10px; left: 10px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25)); }
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <div class="thumb">
      <svg class="star" viewBox="0 0 24 24" fill="#FBC00A" stroke="#D9A209" stroke-width="1.5"><path d="M12 2 L14.6 9 L22 9.5 L16.2 14.5 L18 22 L12 18 L6 22 L7.8 14.5 L2 9.5 L9.4 9 Z"/></svg>
      <span class="dur">12:34</span>
    </div>
    <div class="title">Building a RAG pipeline from scratch</div>
    <div class="meta">42K views<span class="dot"></span>2 days ago</div>
  </div>
  <div class="card">
    <div class="thumb hub"><span class="dur">08:20</span></div>
    <div class="title">Why I switched to Go for AI tooling</div>
    <div class="meta">18K views<span class="dot"></span>1 wk ago</div>
  </div>
  <div class="card">
    <div class="thumb green"><span class="dur">21:05</span></div>
    <div class="title">Kubernetes for tiny side projects</div>
    <div class="meta">9K views<span class="dot"></span>3 wks ago</div>
  </div>
</div></body></html>
