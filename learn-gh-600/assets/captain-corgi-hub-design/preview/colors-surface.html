<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--clay-cream); }
  .wrap { padding: 20px 24px; font-family: var(--font-body); }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; aspect-ratio: 1.2; border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border: var(--bw) solid var(--border-soft); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.1; }
  .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; opacity: 0.8; }
  .dark { color: var(--clay-cream); }
  .light { color: var(--ink); }
</style></head>
<body>
<div class="wrap">
  <div class="row">
    <div class="swatch dark" style="background:#3D768E"><span class="name">Deep Teal</span><span class="hex">#3D768E</span></div>
    <div class="swatch dark" style="background:#DD5D5D"><span class="name">Hub Coral</span><span class="hex">#DD5D5D</span></div>
    <div class="swatch light" style="background:#F6F2EA;border-color:#E6DECB"><span class="name">Clay Cream</span><span class="hex">#F6F2EA</span></div>
    <div class="swatch light" style="background:#FBD9E2;border-color:#F2A8BC"><span class="name">Petal Soft</span><span class="hex">#FBD9E2</span></div>
    <div class="swatch light" style="background:#EFE9DC;border-color:#E6DECB"><span class="name">Cream Sunken</span><span class="hex">#EFE9DC</span></div>
    <div class="swatch dark" style="background:#1F2A33"><span class="name">Ink</span><span class="hex">#1F2A33</span></div>
  </div>
</div></body></html>
