<script>
(function(){'use strict';
  var root=document.documentElement;
  root.classList.toggle('cc-mock-embed',window.self!==window.top);
  var KEY='cc-theme';
  var VALID={'light':1,'dark':1,'night':1};
  function applyCcTheme(){
    try {
      var t=localStorage.getItem(KEY);
      if(t&&VALID[t]) root.setAttribute('data-theme',t);
      else root.removeAttribute('data-theme');
    }catch(err){/* private mode */}
  }
  applyCcTheme();
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY) applyCcTheme();
  });
  /* Hub embed: parent cannot set iframe <html>; sync forced theme via postMessage (plus storage fallback). */
  window.addEventListener('message',function(ev){
    try{
      var d=ev.data;
      if(!d||d.type!=='cc-theme-hub')return;
      var forced=String(d.forced||'');
      if(forced==='light'||forced==='dark'||forced==='night') root.setAttribute('data-theme',forced);
      else root.removeAttribute('data-theme');
    }catch(err2){}
  });
})();
</script>

{d:3,dt:'D3 · Memory & State',q:'External memory is appropriate when:',opts:['State must persist outside the context window or across systems','Tasks are short','Tools are limited','Logs are off'],ans:0,exp:'Correct answer: A) State must persist outside the context window or across systems'},
{d:3,dt:'D3 · Memory & State',q:'Memory pruning supports:',opts:['Keeping memory focused on relevant, current context','Removing all memory','Maximizing context size','Disabling tools'],ans:0,exp:'Correct answer: A) Keeping memory focused on relevant, current context'},
{d:3,dt:'D3 · Memory & State',q:'Durable artifacts let an agent:',opts:['Resume work without repeating completed steps','Increase autonomy','Replace tools','Skip evaluation'],ans:0,exp:'Correct answer: A) Resume work without repeating completed steps'},
{d:3,dt:'D3 · Memory & State',q:'Detecting drift in extended execution involves:',opts:['Comparing ongoing work to original intent and prior decisions','Random checks','Disabling memory','Removing tools'],ans:0,exp:'Correct answer: A) Comparing ongoing work to original intent and prior decisions'},

{d:4,dt:'D4 · Evaluation & Tuning',q:'Tuning workflows means:',opts:['Adjusting the orchestrated steps or process the agent follows','Replacing the LLM','Disabling MCP','Removing memory'],ans:0,exp:'Correct answer: A) Adjusting the orchestrated steps or process the agent follows'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'A reasoning error implies:',opts:['The agent\'s logic produced an incorrect conclusion','The tool failed','The environment changed','Memory expired'],ans:0,exp:'Correct answer: A) The agent\'s logic produced an incorrect conclusion'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Tool misuse implies:',opts:['The agent invoked the wrong tool, with wrong arguments, or at the wrong time','The agent had no tools','The environment failed','Memory expired'],ans:0,exp:'Correct answer: A) The agent invoked the wrong tool, with wrong arguments, or at the wrong time'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'A context/environment issue implies:',opts:['Inputs, configuration, or runtime conditions diverged from expectations','The agent\'s logic was wrong','Memory expired','Tools were missing'],ans:0,exp:'Correct answer: A) Inputs, configuration, or runtime conditions diverged from expectations'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Aligning evaluation with development intent:',opts:['Ensures the agent is evaluated on what actually matters','Reduces token spend only','Replaces guardrails','Disables memory'],ans:0,exp:'Correct answer: A) Ensures the agent is evaluated on what actually matters'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Generating evaluation signals automatically:',opts:['Scales evaluation across runs and tasks','Eliminates the need for any review','Reduces auditability','Disables observability'],ans:0,exp:'Correct answer: A) Scales evaluation across runs and tasks'},
{d:5,dt:'D5 · Multi-Agent',q:'Applying an orchestration pattern:',opts:['Provides structure for how agents interact, sequence, and combine outputs','Disables observability','Increases autonomy without limits','Eliminates evaluation'],ans:0,exp:'Correct answer: A) Provides structure for how agents interact, sequence, and combine outputs'},
{d:5,dt:'D5 · Multi-Agent',q:'Configuring agent isolation:',opts:['Prevents one agent\'s state from corrupting another\'s','Shares state freely','Removes observability','Disables tools'],ans:0,exp:'Correct answer: A) Prevents one agent\'s state from corrupting another\'s'},
{d:5,dt:'D5 · Multi-Agent',q:'Detecting agent conflicts requires:',opts:['Cross-agent change tracking, conflict detection, and resolution policy','Single-agent execution only','No coordination','Disabling logs'],ans:0,exp:'Correct answer: A) Cross-agent change tracking, conflict detection, and resolution policy'},
{d:5,dt:'D5 · Multi-Agent',q:'Multi-agent workflow artifacts should be:',opts:['Suitable for review and audit','Hidden from developers','Only viewable by the orchestrator','Discarded after execution'],ans:0,exp:'Correct answer: A) Suitable for review and audit'},
{d:5,dt:'D5 · Multi-Agent',q:'Documenting handoffs supports:',opts:['Traceability and accountability across agent boundaries','Faster execution only','Smaller LLMs','Disabled guardrails'],ans:0,exp:'Correct answer: A) Traceability and accountability across agent boundaries'},
{d:5,dt:'D5 · Multi-Agent',q:'Stalled multi-agent executions should be:',opts:['Detected and handled with recovery patterns','Ignored indefinitely','Hidden from operators','Logged silently'],ans:0,exp:'Correct answer: A) Detected and handled with recovery patterns'},
{d:5,dt:'D5 · Multi-Agent',q:'Lifecycle changes to agents in active workflows:',opts:['Should avoid disrupting ongoing executions','Always require full workflow stoppage','Are not allowed','Should bypass observability'],ans:0,exp:'Correct answer: A) Should avoid disrupting ongoing executions'},
{d:5,dt:'D5 · Multi-Agent',q:'Retiring an agent:',opts:['Preserves auditability and ensures workflows continue functioning','Deletes all related artifacts','Stops all dependent agents permanently','Disables logging'],ans:0,exp:'Correct answer: A) Preserves auditability and ensures workflows continue functioning'},
{d:6,dt:'D6 · Guardrails',q:'Classifying actions by risk lets you:',opts:['Apply appropriate autonomy and oversight levels','Bypass all guardrails','Disable evaluation','Remove logs'],ans:0,exp:'Correct answer: A) Apply appropriate autonomy and oversight levels'},
{d:6,dt:'D6 · Guardrails',q:'Identifying actions that need human judgment:',opts:['Focuses oversight where it adds the most value','Slows all actions equally','Removes the need for guardrails','Increases autonomy'],ans:0,exp:'Correct answer: A) Focuses oversight where it adds the most value'},
{d:6,dt:'D6 · Guardrails',q:'Blocking compliance-violating actions:',opts:['Prevents harmful or non-compliant outcomes before they occur','Allows them with logging','Defers them indefinitely','Notifies only after'],ans:0,exp:'Correct answer: A) Prevents harmful or non-compliant outcomes before they occur'},
{d:6,dt:'D6 · Guardrails',q:'Scoping execution contexts to least-privilege ensures:',opts:['The agent only has access required for its task','Maximum capability for the agent','No limits','Repo-owner-level permissions'],ans:0,exp:'Correct answer: A) The agent only has access required for its task'},
{d:6,dt:'D6 · Guardrails',q:'Explicit authorization for irreversible changes ensures:',opts:['Accountable, deliberate decisions for high-impact actions','Faster delivery','Less oversight','Reduced logging'],ans:0,exp:'Correct answer: A) Accountable, deliberate decisions for high-impact actions'},
{d:6,dt:'D6 · Guardrails',q:'Preserving velocity while enforcing guardrails means:',opts:['Avoiding approvals that don\'t materially reduce risk','Approving every action','Removing guardrails','Disabling agents'],ans:0,exp:'Correct answer: A) Avoiding approvals that don\'t materially reduce risk'},
{d:6,dt:'D6 · Guardrails',q:'Inspectable artifacts in standard tooling provide:',opts:['The foundation for observability, audit, and intervention','A replacement for guardrails','Faster LLM inference','Smaller MCP registries'],ans:0,exp:'Correct answer: A) The foundation for observability, audit, and intervention'},
{d:6,dt:'D6 · Guardrails',q:'An agent that consistently uses the wrong tool needs:',opts:['Instruction refinement and/or tool access changes','Larger memory','Fewer logs','Bigger LLM only'],ans:0,exp:'Correct answer: A) Instruction refinement and/or tool access changes'},
{d:6,dt:'D6 · Guardrails',q:'A degraded multi-agent workflow shows:',opts:['Partial completions, repeated failures, or coordination drift','Faster results','Better evaluation','Smaller artifacts'],ans:0,exp:'Correct answer: A) Partial completions, repeated failures, or coordination drift'},
{d:6,dt:'D6 · Guardrails',q:'Sharing state across agents requires:',opts:['A defined, consistent representation and synchronization mechanism','Random formats','Disabling memory','Removing tools'],ans:0,exp:'Correct answer: A) A defined, consistent representation and synchronization mechanism'},
{d:6,dt:'D6 · Guardrails',q:'Right-sized human-in-the-loop checks apply to:',opts:['High-risk, irreversible, or compliance-sensitive actions','Every agent action regardless of risk','Only read-only actions','Only tool selection decisions'],ans:0,exp:'Correct answer: A) High-risk, irreversible, or compliance-sensitive actions'},
{d:6,dt:'D6 · Guardrails',q:'A complete evaluation strategy combines:',opts:['Quantitative metrics, qualitative signals, and alignment with development intent','Only automated metrics','Only developer opinions','Only token counts'],ans:0,exp:'Correct answer: A) Quantitative metrics, qualitative signals, and alignment with development intent'},
{d:6,dt:'D6 · Guardrails',q:'Enforcing MCP allow lists demonstrates:',opts:['Tool-level least-privilege and governance','Maximum tool exposure','Bypassing guardrails','Replacing CI'],ans:0,exp:'Correct answer: A) Tool-level least-privilege and governance'},
{d:6,dt:'D6 · Guardrails',q:'Memory and state continuity across tools and environments requires:',opts:['A consistent state contract, synchronization, and conflict resolution','Random sharing','Disabling memory entirely','Single-environment execution only'],ans:0,exp:'Correct answer: A) A consistent state contract, synchronization, and conflict resolution'},
{d:6,dt:'D6 · Guardrails',q:'Which BEST summarizes responsible agentic AI development per GH-600?',opts:['Agents operate with clear scope, observability, accountability, evaluation, and risk-aware guardrails','Agents take all actions autonomously without oversight','Agents replace developers entirely','Agents bypass CI and tooling'],ans:0,exp:'Correct answer: A) Agents operate with clear scope, observability, accountability, evaluation, and risk-aware guardrails'},
];

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

let S={
  phase:'start',
  questions:shuffle(Q),
  answers:{},
  flags:{},
  cur:0,
  startMs:null,
  elapsed:0,
  tid:null
};

const app=document.getElementById('app');

function render(){
  if(S.phase==='start')renderStart();
  else if(S.phase==='exam')renderExam();
  else renderResults();
}

function renderStart(){
  app.innerHTML=`<div class="start-screen">
<div class="start-brand">Captain Corgi Hub</div>
<div class="start-logo" aria-hidden="true"><img src="assets/captain-corgi-hub-design/assets/captain-corgi-hub-avatar.png" alt=""></div>
<div class="start-title">GH-600 practice exam</div>
<div class="start-sub">Practice exam 7 — Fifty questions across all six domains, weighted to match the real exam mix. We drew this from the official Microsoft Learn study guide and GitHub Docs.</div>
<div class="meta-cards">
  <div class="mc"><div class="mc-v">50</div><div class="mc-l">Questions</div></div>
  <div class="mc"><div class="mc-v">90</div><div class="mc-l">Minutes</div></div>
  <div class="mc"><div class="mc-v">700</div><div class="mc-l">Pass mark /1000</div></div>
  <div class="mc"><div class="mc-v">6</div><div class="mc-l">Domains</div></div>
</div>
<div class="start-note">
  <strong>How this run works:</strong> No answer hints until you submit. Flag questions to revisit if you like. The grid tracks where you are. When the timer hits 90 minutes, we auto-submit.
</div>
<button class="btn btn-primary" type="button" id="start-btn" style="font-size:var(--fs-body);padding:11px 32px">Start exam</button>
</div>`;
  document.getElementById('start-btn').onclick=()=>{
    S.phase='exam';S.startMs=Date.now();startTimer();render();
  };
}

function startTimer(){
  S.tid=setInterval(()=>{
    S.elapsed=Math.floor((Date.now()-S.startMs)/1000);
    const rem=MINS*60-S.elapsed;
    if(rem<=0){clearInterval(S.tid);S.phase='results';render();return;}
    const el=document.getElementById('timer-display');
    if(el){
      const m=Math.floor(rem/60),sc=rem%60;
      el.textContent=m+':'+(sc<10?'0':'')+sc;
      const pill=document.getElementById('timer-pill');
      if(pill)pill.className='timer-pill'+(rem<300?' danger':rem<900?' warn':'');
    }
    const fill=document.getElementById('prog-fill');
    if(fill)fill.style.width=(S.cur/S.questions.length*100)+'%';
  },1000);
}

function renderExam(){
  const q=S.questions[S.cur];
  const total=S.questions.length;
  const answered=Object.keys(S.answers).length;
  const flagged=Object.values(S.flags).filter(Boolean).length;
  const rem=MINS*60-S.elapsed;
  const m=Math.floor(rem/60),sc=rem%60;

  app.innerHTML=`
<div class="exam-header">
  <div class="eh-title">GH-600 practice exam</div>
  <span class="eh-meta">${answered} answered · ${flagged} flagged</span>
  <div class="timer-pill" id="timer-pill"><span id="timer-display">${m}:${sc<10?'0':''}${sc}</span></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:${S.cur/total*100}%"></div></div>
<div class="exam-body">
  <div class="q-sidebar">
    <div class="qs-label">Question list</div>
    <div class="qs-stats">Answered: <span>${answered}/${total}</span></div>
    <div class="q-grid" id="q-grid"></div>
    <button class="btn btn-danger" type="button" id="sb-submit" style="width:100%;justify-content:center">Submit</button>
  </div>
  <div class="q-panel">
    <div class="q-meta">
      <span class="q-num-badge">Q${S.cur+1} / ${total}</span>
      <span class="q-domain-badge">${q.dt}</span>
      ${S.flags[S.cur]?'<span class="q-flag-badge">Flagged</span>':''}
    </div>
    <div class="q-text">${q.q}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt${S.answers[S.cur]===i?' sel':''}" data-i="${i}"><span class="opt-l">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="q-nav-bar">
      <div class="btn-row">
        <button class="btn" type="button" id="prev" ${S.cur===0?'disabled':''}>Previous</button>
        <button class="btn" type="button" id="flag-btn">${S.flags[S.cur]?'Unflag':'Flag'}</button>
        <button class="btn" type="button" id="next" ${S.cur===total-1?'disabled':''}>Next</button>
      </div>
      <button class="btn btn-danger" type="button" id="submit-btn">Submit exam</button>
    </div>
  </div>
</div>
<div id="modal-area"></div>`;

  const grid=document.getElementById('q-grid');
  S.questions.forEach((_,i)=>{
    const b=document.createElement('button');
    const isAns=S.answers[i]!==undefined,isFlag=S.flags[i],isCur=i===S.cur;
    b.className='q-dot '+(isFlag?'flag':isAns?'ans':'unans')+(isCur?' cur':'');
    b.textContent=i+1;b.title='Q'+(i+1);
    b.onclick=()=>{S.cur=i;render();};
    grid.appendChild(b);
  });

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{S.answers[S.cur]=parseInt(btn.dataset.i);render();};
  });
  document.getElementById('prev').onclick=()=>{if(S.cur>0){S.cur--;render();}};
  document.getElementById('next').onclick=()=>{if(S.cur<total-1){S.cur++;render();}};
  document.getElementById('flag-btn').onclick=()=>{S.flags[S.cur]=!S.flags[S.cur];render();};

  const showConfirm=()=>{
    const unanswered=total-Object.keys(S.answers).length;
    document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" id="modal-overlay">
<div class="modal">
  <h3>Submit your exam?</h3>
  <p>${unanswered>0?`You still have <strong>${unanswered}</strong> unanswered question${unanswered!==1?'s':''}.`:'Every question has an answer.'} We will score what you have now.</p>
  <div class="modal-btns">
    <button class="btn" type="button" id="cancel-btn">Cancel</button>
    <button class="btn btn-primary" type="button" id="confirm-btn">Submit</button>
  </div>
</div></div>`;
    document.getElementById('confirm-btn').onclick=()=>{clearInterval(S.tid);S.phase='results';render();};
    document.getElementById('cancel-btn').onclick=()=>{document.getElementById('modal-area').innerHTML='';};
    document.getElementById('modal-overlay').onclick=e=>{if(e.target.id==='modal-overlay')document.getElementById('modal-area').innerHTML='';};
  };
  document.getElementById('submit-btn').onclick=showConfirm;
  document.getElementById('sb-submit').onclick=showConfirm;
}

function renderResults(){
  clearInterval(S.tid);
  const total=S.questions.length;
  let correct=0;
  const ds={1:{n:'D1 · Architecture & SDLC',c:0,t:0},2:{n:'D2 · Tool Use & MCP',c:0,t:0},3:{n:'D3 · Memory & State',c:0,t:0},4:{n:'D4 · Evaluation & Tuning',c:0,t:0},5:{n:'D5 · Multi-Agent',c:0,t:0},6:{n:'D6 · Guardrails',c:0,t:0}};
  S.questions.forEach((q,i)=>{ds[q.d].t++;if(S.answers[i]===q.ans){correct++;ds[q.d].c++;}});
  const scaled=Math.round(correct/total*1000);
  const pass=scaled>=PASS;
  const pct=Math.round(correct/total*100);
  const elapsed=S.elapsed,em=Math.floor(elapsed/60),es=elapsed%60;

  let domCards='';
  [1,2,3,4,5,6].forEach(d=>{
    const {n,c,t}=ds[d];
    const p=Math.round(c/t*100);
    const cls=p>=75?'g':p>=60?'m':'b';
    domCards+=`<div class="db-card"><div class="db-name">${n}</div><div class="db-score">${c}/${t} <span style="font-size:var(--fs-small);color:var(--fg-3)">(${p}%)</span></div><div class="db-bar-bg"><div class="db-bar-fill ${cls}" style="width:${p}%"></div></div></div>`;
  });

  app.innerHTML=`<div class="results-page">
<div class="result-hero">
  <div class="result-score ${pass?'pass':'fail'}">${scaled}</div>
  <div class="result-verdict">${pass?'Nice work — that\'s a pass':'Not this time — keep going'}</div>
  <div class="result-sub">${correct}/${total} correct (${pct}%) · Pass mark: 700/1000</div>
  <div class="result-meta">
    <span class="rm-chip">Time used: ${em}m ${es}s</span>
    <span class="rm-chip">${pass?'Above pass mark':'Below pass mark'}</span>
    <span class="rm-chip">${Object.values(S.flags).filter(Boolean).length} flagged questions</span>
  </div>
</div>
<div class="domain-breakdown-title">Score by domain</div>
<div class="domain-breakdown">${domCards}</div>
<div class="divider"></div>
<div class="btn-row" style="margin-bottom:var(--space-5)">
  <button class="btn btn-primary" type="button" id="review-btn">Review all answers</button>
  <button class="btn" type="button" id="retake-btn">Retake exam</button>
</div>
<div id="review-out"></div>
</div>`;

  document.getElementById('retake-btn').onclick=()=>{
    clearInterval(S.tid);
    S={phase:'start',questions:shuffle(Q),answers:{},flags:{},cur:0,startMs:null,elapsed:0,tid:null};
    render();
  };

  let open=false;
  document.getElementById('review-btn').onclick=()=>{
    const out=document.getElementById('review-out');
    if(open){out.innerHTML='';open=false;document.getElementById('review-btn').textContent='Review all answers';return;}
    open=true;document.getElementById('review-btn').textContent='Hide review';
    let html=`<div class="domain-breakdown-title" style="margin-bottom:var(--space-3)">Every question — ${total} total</div>`;
    S.questions.forEach((q,i)=>{
      const chosen=S.answers[i],isOk=chosen===q.ans,skip=chosen===undefined;
      const status=skip?'<span style="color:var(--warning)">Skipped</span>':isOk?'<span style="color:var(--success)">Correct</span>':'<span style="color:var(--danger)">Wrong</span>';
      html+=`<div class="rq ${skip?'skip':isOk?'ok':'bad'}">
<div class="rq-meta"><strong>Q${i+1}</strong><span>${q.dt}</span>${status}</div>
<div class="rq-q">${q.q}</div>`;
      q.opts.forEach((o,oi)=>{
        let cls='nn';
        if(oi===q.ans&&chosen===oi)cls='cc';
        else if(oi===chosen&&chosen!==q.ans)cls='cw';
        else if(oi===q.ans)cls='rc';
        html+=`<div class="ro ${cls}"><span style="font-weight:700;flex-shrink:0;font-family:var(--font-mono)">${LETTERS[oi]}.</span><span>${o}</span></div>`;
      });
      html+=`<div class="rq-exp"><strong>Explanation:</strong> ${q.exp}</div></div>`;
    });
    out.innerHTML=html;out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}

render();
</script>
</body>
</html>
