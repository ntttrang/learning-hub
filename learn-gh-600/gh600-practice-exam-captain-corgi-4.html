<script>
(function(){'use strict';
  var root=document.documentElement;
  root.classList.toggle('cc-mock-embed',window.self!==window.top);
  var KEY='cc-theme';
  var VALID={'light':1,'dark':1,'night':1};
  function applyCcTheme(){
    try {
      var t=localStorage.getItem(KEY);
      if(t&&VALID[t]) root.setAttribute('data-theme',t);
      else root.removeAttribute('data-theme');
    }catch(err){/* private mode */}
  }
  applyCcTheme();
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY) applyCcTheme();
  });
  /* Hub embed: parent cannot set iframe <html>; sync forced theme via postMessage (plus storage fallback). */
  window.addEventListener('message',function(ev){
    try{
      var d=ev.data;
      if(!d||d.type!=='cc-theme-hub')return;
      var forced=String(d.forced||'');
      if(forced==='light'||forced==='dark'||forced==='night') root.setAttribute('data-theme',forced);
      else root.removeAttribute('data-theme');
    }catch(err2){}
  });
})();
</script>

{d:1,dt:'D1 · Architecture & SDLC',q:'What document defines what an agent should accomplish?',opts:['The MCP allow list','The agent\'s success criteria, inputs, and outputs','The branch protection rules','The CI workflow file'],ans:1,exp:'Correct answer: B) The agent\'s success criteria, inputs, and outputs'},

{d:2,dt:'D2 · Tool Use & MCP',q:'Configuring an agent for environment-specific constraints means:',opts:['Using one config for all environments','Adjusting the agent\'s behavior or limits based on the target environment','Removing environment dependencies','Hardcoding production values'],ans:1,exp:'Correct answer: B) Adjusting the agent\'s behavior or limits based on the target environment'},

{d:3,dt:'D3 · Memory & State',q:'Short-term memory in agents is BEST suited for:',opts:['Cross-session preferences','The current task\'s working context','Long historical records','Audit trails'],ans:1,exp:'Correct answer: B) The current task\'s working context'},
{d:3,dt:'D3 · Memory & State',q:'Memory pruning prevents:',opts:['Token cost explosions and stale context','Tool misuse','MCP violations','Branch conflicts'],ans:0,exp:'Correct answer: A) Token cost explosions and stale context'},
{d:3,dt:'D3 · Memory & State',q:'Detecting drift requires:',opts:['Comparing current execution state against prior decisions or intent','Disabling logging','Removing memory','Increasing autonomy'],ans:0,exp:'Correct answer: A) Comparing current execution state against prior decisions or intent'},
{d:3,dt:'D3 · Memory & State',q:'Sharing agent state across tools/environments requires:',opts:['A common, well-defined state representation','Disabling tools','Single-agent execution','Branch scoping only'],ans:0,exp:'Correct answer: A) A common, well-defined state representation'},
{d:3,dt:'D3 · Memory & State',q:'Preventing stale context means:',opts:['Letting memory grow indefinitely','Refreshing or invalidating context when underlying data changes','Removing all memory','Using only short-term memory'],ans:1,exp:'Correct answer: B) Refreshing or invalidating context when underlying data changes'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'"Operational constraints" for an agent task are:',opts:['Limits on time, resources, or scope the agent must respect','Optional preferences','The agent\'s tool list','The CI pipeline runtime'],ans:0,exp:'Correct answer: A) Limits on time, resources, or scope the agent must respect'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Qualitative signals include:',opts:['Pass rates','Developer reviews and feedback on output usefulness','Tool call counts','Branch counts'],ans:1,exp:'Correct answer: B) Developer reviews and feedback on output usefulness'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Identifying failures uses:',opts:['Logs, plans, traces, outputs, and workflow artifacts','Only LLM logs','Only developer feedback','Token counts'],ans:0,exp:'Correct answer: A) Logs, plans, traces, outputs, and workflow artifacts'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Classifying a failure as a "tool misuse" implies:',opts:['The agent had the wrong reasoning','The agent used a tool incorrectly or chose the wrong tool','The environment was misconfigured','Memory was stale'],ans:1,exp:'Correct answer: B) The agent used a tool incorrectly or chose the wrong tool'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Tuning instructions, workflows, and constraints addresses:',opts:['Network speed','Behavioral problems revealed in evaluation','MCP registry size','Branch protection'],ans:1,exp:'Correct answer: B) Behavioral problems revealed in evaluation'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Aligning evaluation criteria with development intent means:',opts:['Using only generic AI benchmarks','Measuring whether the agent delivers what the team actually needs','Skipping evaluation','Using random metrics'],ans:1,exp:'Correct answer: B) Measuring whether the agent delivers what the team actually needs'},
{d:4,dt:'D4 · Evaluation & Tuning',q:'Automated scanning enables:',opts:['Continuous, repeatable evaluation signals in CI','Manual review only','Disabling guardrails','Eliminating tests'],ans:0,exp:'Correct answer: A) Continuous, repeatable evaluation signals in CI'},
{d:5,dt:'D5 · Multi-Agent',q:'A common multi-agent orchestration pattern is:',opts:['Orchestrator-worker','Single-prompt','Read-only','Branch-only'],ans:0,exp:'Correct answer: A) Orchestrator-worker'},
{d:5,dt:'D5 · Multi-Agent',q:'Agent isolation supports:',opts:['Memory growth','Safe parallel execution without cross-interference','Tool sharing','MCP caching'],ans:1,exp:'Correct answer: B) Safe parallel execution without cross-interference'},
{d:5,dt:'D5 · Multi-Agent',q:'Duplicated effort across agents should be:',opts:['Encouraged','Detected and resolved through coordination','Logged but ignored','Used to validate outputs'],ans:1,exp:'Correct answer: B) Detected and resolved through coordination'},
{d:5,dt:'D5 · Multi-Agent',q:'Multi-agent observability needs:',opts:['Logs, artifacts, and operational signals','Only the orchestrator\'s logs','UI dashboards only','None — agents are autonomous'],ans:0,exp:'Correct answer: A) Logs, artifacts, and operational signals'},
{d:5,dt:'D5 · Multi-Agent',q:'Documenting outcomes across agents helps with:',opts:['Audit, review, and learning','Speeding up execution','Disabling guardrails','Reducing memory'],ans:0,exp:'Correct answer: A) Audit, review, and learning'},
{d:5,dt:'D5 · Multi-Agent',q:'A stalled agent should trigger:',opts:['Indefinite waiting','Detection and recovery (rollback, escalation, or human intervention)','Silent removal','Memory expansion'],ans:1,exp:'Correct answer: B) Detection and recovery (rollback, escalation, or human intervention)'},
{d:5,dt:'D5 · Multi-Agent',q:'Replacing an agent without disrupting active workflows requires:',opts:['Stopping all workflows','Compatible interfaces and non-breaking updates','Removing all observability','Deleting the previous agent\'s artifacts'],ans:1,exp:'Correct answer: B) Compatible interfaces and non-breaking updates'},
{d:5,dt:'D5 · Multi-Agent',q:'Retiring an agent while preserving auditability requires:',opts:['Deleting logs','Retaining historical artifacts and transferring responsibilities','Disabling all related workflows','Removing the MCP allow list'],ans:1,exp:'Correct answer: B) Retaining historical artifacts and transferring responsibilities'},
{d:6,dt:'D6 · Guardrails',q:'Autonomy levels should map to:',opts:['Risk level of agent actions','Number of tools available','Branch count','LLM size'],ans:0,exp:'Correct answer: A) Risk level of agent actions'},
{d:6,dt:'D6 · Guardrails',q:'Actions requiring human judgment include:',opts:['All file reads','Compliance-sensitive or irreversible changes','Posting comments','Running tests'],ans:1,exp:'Correct answer: B) Compliance-sensitive or irreversible changes'},
{d:6,dt:'D6 · Guardrails',q:'Scoping permissions to enforce least-privilege:',opts:['Limits the blast radius if the agent misbehaves','Increases agent capability','Eliminates audit needs','Removes the need for guardrails'],ans:0,exp:'Correct answer: A) Limits the blast radius if the agent misbehaves'},
{d:6,dt:'D6 · Guardrails',q:'Controlled paths for irreversible changes mean:',opts:['Allow the agent to act freely','Require defined authorization workflows for high-impact actions','Skip review','Use random approvers'],ans:1,exp:'Correct answer: B) Require defined authorization workflows for high-impact actions'},
{d:6,dt:'D6 · Guardrails',q:'A balanced guardrail strategy:',opts:['Adds approvals for every action','Targets oversight where risk is meaningful, preserving velocity elsewhere','Removes all guardrails','Limits the agent to read-only'],ans:1,exp:'Correct answer: B) Targets oversight where risk is meaningful, preserving velocity elsewhere'},
{d:6,dt:'D6 · Guardrails',q:'Blocking violations of Responsible AI policies:',opts:['Is optional','Must occur before the action is executed','Is only for production','Is handled by the LLM provider'],ans:1,exp:'Correct answer: B) Must occur before the action is executed'},
{d:6,dt:'D6 · Guardrails',q:'An agent that creates a PR but then makes destructive force-pushes is exhibiting:',opts:['Effective autonomy','Missing guardrails on high-risk actions','Healthy planning','Effective evaluation'],ans:1,exp:'Correct answer: B) Missing guardrails on high-risk actions'},
{d:6,dt:'D6 · Guardrails',q:'Audit logs are MOST useful for:',opts:['Increasing autonomy','Demonstrating accountability and traceability after the fact','Reducing tool use','Skipping evaluation'],ans:1,exp:'Correct answer: B) Demonstrating accountability and traceability after the fact'},
{d:6,dt:'D6 · Guardrails',q:'Drift correction in extended execution often involves:',opts:['Re-anchoring to original goals/decisions','Removing memory','Increasing autonomy','Adding more tools'],ans:0,exp:'Correct answer: A) Re-anchoring to original goals/decisions'},
{d:6,dt:'D6 · Guardrails',q:'A multi-agent workflow that lacks shared state representation is likely to:',opts:['Work flawlessly','Produce conflicting or stale decisions','Reduce token use','Improve evaluation'],ans:1,exp:'Correct answer: B) Produce conflicting or stale decisions'},
{d:6,dt:'D6 · Guardrails',q:'An agent attempts to modify a critical file outside its scope. Best response:',opts:['Allow it with a warning','Block the action and escalate','Log it after the fact','Increase the agent\'s permissions'],ans:1,exp:'Correct answer: B) Block the action and escalate'},
{d:6,dt:'D6 · Guardrails',q:'The PRIMARY goal of agent guardrails is to:',opts:['Slow the agent','Enforce safe, compliant behavior aligned with policy','Maximize autonomy','Disable tools'],ans:1,exp:'Correct answer: B) Enforce safe, compliant behavior aligned with policy'},
{d:6,dt:'D6 · Guardrails',q:'Branch-based scope limits:',opts:['The scope of changes an agent can make','LLM inference speed','MCP servers','Memory growth'],ans:0,exp:'Correct answer: A) The scope of changes an agent can make'},
{d:6,dt:'D6 · Guardrails',q:'Refining tool access during tuning means:',opts:['Adding/removing tools based on observed agent needs and risks','Always adding more tools','Disabling MCP','Random changes'],ans:0,exp:'Correct answer: A) Adding/removing tools based on observed agent needs and risks'},
{d:6,dt:'D6 · Guardrails',q:'What is the END goal of the GH-600 curriculum?',opts:['Maximum agent autonomy at all costs','Safe, observable, accountable, and effective use of agents in the SDLC','Eliminating human reviewers','Replacing all developers'],ans:1,exp:'Correct answer: B) Safe, observable, accountable, and effective use of agents in the SDLC'},
];

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

let S={
  phase:'start',
  questions:shuffle(Q),
  answers:{},
  flags:{},
  cur:0,
  startMs:null,
  elapsed:0,
  tid:null
};

const app=document.getElementById('app');

function render(){
  if(S.phase==='start')renderStart();
  else if(S.phase==='exam')renderExam();
  else renderResults();
}

function renderStart(){
  app.innerHTML=`<div class="start-screen">
<div class="start-brand">Captain Corgi Hub</div>
<div class="start-logo" aria-hidden="true"><img src="assets/captain-corgi-hub-design/assets/captain-corgi-hub-avatar.png" alt=""></div>
<div class="start-title">GH-600 practice exam</div>
<div class="start-sub">Practice exam 4 — Fifty questions across all six domains, weighted to match the real exam mix. We drew this from the official Microsoft Learn study guide and GitHub Docs.</div>
<div class="meta-cards">
  <div class="mc"><div class="mc-v">50</div><div class="mc-l">Questions</div></div>
  <div class="mc"><div class="mc-v">90</div><div class="mc-l">Minutes</div></div>
  <div class="mc"><div class="mc-v">700</div><div class="mc-l">Pass mark /1000</div></div>
  <div class="mc"><div class="mc-v">6</div><div class="mc-l">Domains</div></div>
</div>
<div class="start-note">
  <strong>How this run works:</strong> No answer hints until you submit. Flag questions to revisit if you like. The grid tracks where you are. When the timer hits 90 minutes, we auto-submit.
</div>
<button class="btn btn-primary" type="button" id="start-btn" style="font-size:var(--fs-body);padding:11px 32px">Start exam</button>
</div>`;
  document.getElementById('start-btn').onclick=()=>{
    S.phase='exam';S.startMs=Date.now();startTimer();render();
  };
}

function startTimer(){
  S.tid=setInterval(()=>{
    S.elapsed=Math.floor((Date.now()-S.startMs)/1000);
    const rem=MINS*60-S.elapsed;
    if(rem<=0){clearInterval(S.tid);S.phase='results';render();return;}
    const el=document.getElementById('timer-display');
    if(el){
      const m=Math.floor(rem/60),sc=rem%60;
      el.textContent=m+':'+(sc<10?'0':'')+sc;
      const pill=document.getElementById('timer-pill');
      if(pill)pill.className='timer-pill'+(rem<300?' danger':rem<900?' warn':'');
    }
    const fill=document.getElementById('prog-fill');
    if(fill)fill.style.width=(S.cur/S.questions.length*100)+'%';
  },1000);
}

function renderExam(){
  const q=S.questions[S.cur];
  const total=S.questions.length;
  const answered=Object.keys(S.answers).length;
  const flagged=Object.values(S.flags).filter(Boolean).length;
  const rem=MINS*60-S.elapsed;
  const m=Math.floor(rem/60),sc=rem%60;

  app.innerHTML=`
<div class="exam-header">
  <div class="eh-title">GH-600 practice exam</div>
  <span class="eh-meta">${answered} answered · ${flagged} flagged</span>
  <div class="timer-pill" id="timer-pill"><span id="timer-display">${m}:${sc<10?'0':''}${sc}</span></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:${S.cur/total*100}%"></div></div>
<div class="exam-body">
  <div class="q-sidebar">
    <div class="qs-label">Question list</div>
    <div class="qs-stats">Answered: <span>${answered}/${total}</span></div>
    <div class="q-grid" id="q-grid"></div>
    <button class="btn btn-danger" type="button" id="sb-submit" style="width:100%;justify-content:center">Submit</button>
  </div>
  <div class="q-panel">
    <div class="q-meta">
      <span class="q-num-badge">Q${S.cur+1} / ${total}</span>
      <span class="q-domain-badge">${q.dt}</span>
      ${S.flags[S.cur]?'<span class="q-flag-badge">Flagged</span>':''}
    </div>
    <div class="q-text">${q.q}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt${S.answers[S.cur]===i?' sel':''}" data-i="${i}"><span class="opt-l">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="q-nav-bar">
      <div class="btn-row">
        <button class="btn" type="button" id="prev" ${S.cur===0?'disabled':''}>Previous</button>
        <button class="btn" type="button" id="flag-btn">${S.flags[S.cur]?'Unflag':'Flag'}</button>
        <button class="btn" type="button" id="next" ${S.cur===total-1?'disabled':''}>Next</button>
      </div>
      <button class="btn btn-danger" type="button" id="submit-btn">Submit exam</button>
    </div>
  </div>
</div>
<div id="modal-area"></div>`;

  const grid=document.getElementById('q-grid');
  S.questions.forEach((_,i)=>{
    const b=document.createElement('button');
    const isAns=S.answers[i]!==undefined,isFlag=S.flags[i],isCur=i===S.cur;
    b.className='q-dot '+(isFlag?'flag':isAns?'ans':'unans')+(isCur?' cur':'');
    b.textContent=i+1;b.title='Q'+(i+1);
    b.onclick=()=>{S.cur=i;render();};
    grid.appendChild(b);
  });

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{S.answers[S.cur]=parseInt(btn.dataset.i);render();};
  });
  document.getElementById('prev').onclick=()=>{if(S.cur>0){S.cur--;render();}};
  document.getElementById('next').onclick=()=>{if(S.cur<total-1){S.cur++;render();}};
  document.getElementById('flag-btn').onclick=()=>{S.flags[S.cur]=!S.flags[S.cur];render();};

  const showConfirm=()=>{
    const unanswered=total-Object.keys(S.answers).length;
    document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" id="modal-overlay">
<div class="modal">
  <h3>Submit your exam?</h3>
  <p>${unanswered>0?`You still have <strong>${unanswered}</strong> unanswered question${unanswered!==1?'s':''}.`:'Every question has an answer.'} We will score what you have now.</p>
  <div class="modal-btns">
    <button class="btn" type="button" id="cancel-btn">Cancel</button>
    <button class="btn btn-primary" type="button" id="confirm-btn">Submit</button>
  </div>
</div></div>`;
    document.getElementById('confirm-btn').onclick=()=>{clearInterval(S.tid);S.phase='results';render();};
    document.getElementById('cancel-btn').onclick=()=>{document.getElementById('modal-area').innerHTML='';};
    document.getElementById('modal-overlay').onclick=e=>{if(e.target.id==='modal-overlay')document.getElementById('modal-area').innerHTML='';};
  };
  document.getElementById('submit-btn').onclick=showConfirm;
  document.getElementById('sb-submit').onclick=showConfirm;
}

function renderResults(){
  clearInterval(S.tid);
  const total=S.questions.length;
  let correct=0;
  const ds={1:{n:'D1 · Architecture & SDLC',c:0,t:0},2:{n:'D2 · Tool Use & MCP',c:0,t:0},3:{n:'D3 · Memory & State',c:0,t:0},4:{n:'D4 · Evaluation & Tuning',c:0,t:0},5:{n:'D5 · Multi-Agent',c:0,t:0},6:{n:'D6 · Guardrails',c:0,t:0}};
  S.questions.forEach((q,i)=>{ds[q.d].t++;if(S.answers[i]===q.ans){correct++;ds[q.d].c++;}});
  const scaled=Math.round(correct/total*1000);
  const pass=scaled>=PASS;
  const pct=Math.round(correct/total*100);
  const elapsed=S.elapsed,em=Math.floor(elapsed/60),es=elapsed%60;

  let domCards='';
  [1,2,3,4,5,6].forEach(d=>{
    const {n,c,t}=ds[d];
    const p=Math.round(c/t*100);
    const cls=p>=75?'g':p>=60?'m':'b';
    domCards+=`<div class="db-card"><div class="db-name">${n}</div><div class="db-score">${c}/${t} <span style="font-size:var(--fs-small);color:var(--fg-3)">(${p}%)</span></div><div class="db-bar-bg"><div class="db-bar-fill ${cls}" style="width:${p}%"></div></div></div>`;
  });

  app.innerHTML=`<div class="results-page">
<div class="result-hero">
  <div class="result-score ${pass?'pass':'fail'}">${scaled}</div>
  <div class="result-verdict">${pass?'Nice work — that\'s a pass':'Not this time — keep going'}</div>
  <div class="result-sub">${correct}/${total} correct (${pct}%) · Pass mark: 700/1000</div>
  <div class="result-meta">
    <span class="rm-chip">Time used: ${em}m ${es}s</span>
    <span class="rm-chip">${pass?'Above pass mark':'Below pass mark'}</span>
    <span class="rm-chip">${Object.values(S.flags).filter(Boolean).length} flagged questions</span>
  </div>
</div>
<div class="domain-breakdown-title">Score by domain</div>
<div class="domain-breakdown">${domCards}</div>
<div class="divider"></div>
<div class="btn-row" style="margin-bottom:var(--space-5)">
  <button class="btn btn-primary" type="button" id="review-btn">Review all answers</button>
  <button class="btn" type="button" id="retake-btn">Retake exam</button>
</div>
<div id="review-out"></div>
</div>`;

  document.getElementById('retake-btn').onclick=()=>{
    clearInterval(S.tid);
    S={phase:'start',questions:shuffle(Q),answers:{},flags:{},cur:0,startMs:null,elapsed:0,tid:null};
    render();
  };

  let open=false;
  document.getElementById('review-btn').onclick=()=>{
    const out=document.getElementById('review-out');
    if(open){out.innerHTML='';open=false;document.getElementById('review-btn').textContent='Review all answers';return;}
    open=true;document.getElementById('review-btn').textContent='Hide review';
    let html=`<div class="domain-breakdown-title" style="margin-bottom:var(--space-3)">Every question — ${total} total</div>`;
    S.questions.forEach((q,i)=>{
      const chosen=S.answers[i],isOk=chosen===q.ans,skip=chosen===undefined;
      const status=skip?'<span style="color:var(--warning)">Skipped</span>':isOk?'<span style="color:var(--success)">Correct</span>':'<span style="color:var(--danger)">Wrong</span>';
      html+=`<div class="rq ${skip?'skip':isOk?'ok':'bad'}">
<div class="rq-meta"><strong>Q${i+1}</strong><span>${q.dt}</span>${status}</div>
<div class="rq-q">${q.q}</div>`;
      q.opts.forEach((o,oi)=>{
        let cls='nn';
        if(oi===q.ans&&chosen===oi)cls='cc';
        else if(oi===chosen&&chosen!==q.ans)cls='cw';
        else if(oi===q.ans)cls='rc';
        html+=`<div class="ro ${cls}"><span style="font-weight:700;flex-shrink:0;font-family:var(--font-mono)">${LETTERS[oi]}.</span><span>${o}</span></div>`;
      });
      html+=`<div class="rq-exp"><strong>Explanation:</strong> ${q.exp}</div></div>`;
    });
    out.innerHTML=html;out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}

render();
</script>
</body>
</html>
