name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch donor submodules
        # Extractor scripts compile (tsc -b) and parity suites test against
        # donor sources — the gate needs the submodules present. learn-dp-800
        # and learn-gh-200 are private, so the job token cannot read them, and
        # actions/checkout clobbers a global insteadOf entry while setting up
        # its own submodule auth — hence this separate step, with the
        # authenticated rewrite scoped to those two URLs only. learn-gh-600 is
        # public and keeps cloning without a token.
        env:
          DONOR_READ_TOKEN: ${{ secrets.DONOR_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${DONOR_READ_TOKEN}@github.com/ntttrang/learn-dp-800.git".insteadOf "https://github.com/ntttrang/learn-dp-800.git"
          git config --global url."https://x-access-token:${DONOR_READ_TOKEN}@github.com/ntttrang/learn-gh-200.git".insteadOf "https://github.com/ntttrang/learn-gh-200.git"
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Content integrity
        run: npm run content:check
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
